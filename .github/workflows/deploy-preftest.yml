# preftest.jdsf-seibu.com への配信（SSH/rsync）
# ※2026-07 のFTP不正アクセス疑い/パスワード変更を受け、FTP(lftp)から SSH へ移行。
#   deploy-prod.yml と同じ SSH デプロイ鍵（Secret: SSH_PRIVATE_KEY_B64）を使用。
name: Deploy preftest to XServer

on:
  push:
    branches: [ master, main ]
    paths:
      - 'preftest/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to XServer (preftest.jdsf-seibu.com)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 sv16504.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy preftest/ via rsync over SSH
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            --exclude='data/' \
            --exclude='uploads/' \
            preftest/ \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/preftest.jdsf-seibu.com/

      # 認証マスター秘密を data/auth_secret.php としてサーバーへ配置（ブラウザにもGitにも出さない）
      - name: Write auth master secret
        env:
          AUTH_MASTER_SECRET: ${{ secrets.AUTH_MASTER_SECRET }}
        run: |
          ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no jdsfseibu@sv16504.xserver.jp \
            "mkdir -p /home/jdsfseibu/jdsf-seibu.com/public_html/preftest.jdsf-seibu.com/data"
          printf '<?php return %s;\n' "'$AUTH_MASTER_SECRET'" > auth_secret.php
          scp -i ~/.ssh/deploy_key -P 10022 -o StrictHostKeyChecking=no \
            auth_secret.php \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/preftest.jdsf-seibu.com/data/auth_secret.php
          rm -f auth_secret.php

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
