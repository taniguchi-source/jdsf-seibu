name: Deploy preftest to XServer

on:
  push:
    branches: [ master, main ]
    paths:
      - 'preftest/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to XServer (preftest.jdsf-seibu.com)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy preftest/ to XServer
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                set net:timeout 30; set net:max-retries 3; \
                mirror -R --delete \
                  --exclude '^data/' \
                  preftest/ \
                  /jdsf-seibu.com/public_html/preftest.jdsf-seibu.com/; \
                quit"
