name: Fetch Seibu Block Competitions

on:
  schedule:
    # 月・水・金 の 06:00 JST（21:00 UTC 前日）に実行
    - cron: '0 21 * * 0,2,4'
  workflow_dispatch:  # 手動実行も可能

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # JSON ファイルをコミット・プッシュするために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch competition data from JDSF
        run: python scripts/fetch_competitions.py

      - name: Commit and push if data changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/competitions_seibu.json
          git diff --staged --quiet \
            || git commit -m "chore: update Seibu block competition data [skip ci]"
          git push
