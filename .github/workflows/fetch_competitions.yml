name: Deploy to XServer

on:
  push:
    branches: [ master ]       # コードを更新したとき
  schedule:
    - cron: '0 21 * * *'       # 毎日 06:00 JST（データ自動取得）
  workflow_dispatch:             # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch competition data（西部ブロック）
        run: python scripts/fetch_competitions.py

      - name: Fetch training event data（西部ブロック）
        run: python scripts/fetch_events.py

      - name: Fetch news data（お知らせ）
        run: python scripts/fetch_news.py

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to XServer via FTP
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                mirror -R --delete --ignore-time --exclude ^\.git --exclude ^\.github --exclude ^scripts . /jdsf-seibu.com/public_html/test.jdsf-seibu.com/; \
                put -O /jdsf-seibu.com/public_html/test.jdsf-seibu.com/data/ data/news.json; \
                put -O /jdsf-seibu.com/public_html/test.jdsf-seibu.com/data/ data/competitions_seibu.json; \
                put -O /jdsf-seibu.com/public_html/test.jdsf-seibu.com/data/ data/events_seibu.json; \
                quit"
