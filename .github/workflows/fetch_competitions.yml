name: Deploy to XServer

on:
  push:
    branches: [ master ]       # コードを更新したとき
  schedule:
    - cron: '0 21 * * 0,2,4'  # 月・水・金 06:00 JST（データ自動取得）
  workflow_dispatch:             # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch competition data（西部ブロック）
        run: python scripts/fetch_competitions.py

      - name: Fetch training event data（西部ブロック）
        run: python scripts/fetch_events.py

      - name: Deploy to XServer via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: sv16504.xserver.jp
          username: jdsfseibu
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /test.jdsf-seibu.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/scripts/**
            **/node_modules/**
            **/.github/**
