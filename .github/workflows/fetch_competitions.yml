name: Fetch & Deploy Data

on:
  schedule:
    - cron: '0 21 * * *'       # 毎日 06:00 JST（データ自動取得）
  workflow_dispatch:             # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # 各取得は独立（1つ失敗しても他の配信は止めない）。失敗したものは配信しない＝本番を上書きしない。
      - name: Fetch competition data（西部ブロック）
        id: fetch_comp
        continue-on-error: true
        run: python scripts/fetch_competitions.py

      - name: Fetch training event data（西部ブロック）
        id: fetch_events
        continue-on-error: true
        run: python scripts/fetch_events.py

      - name: Fetch news data（お知らせ）
        id: fetch_news
        continue-on-error: true
        run: python scripts/fetch_news.py

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 sv16504.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy competitions_seibu.json（成功時のみ）
        if: steps.fetch_comp.outcome == 'success'
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            data/competitions_seibu.json \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/data/

      - name: Deploy events_seibu.json（成功時のみ）
        if: steps.fetch_events.outcome == 'success'
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            data/events_seibu.json \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/data/

      - name: Deploy news.json（成功時のみ）
        if: steps.fetch_news.outcome == 'success'
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            data/news.json \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/data/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
