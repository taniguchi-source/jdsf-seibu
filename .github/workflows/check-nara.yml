name: Check Nara Directory (一時確認用)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: List nara directory contents
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; find /jdsf-seibu.com/public_html/nara.jdsf-seibu.com/; quit" 2>&1 || echo "Directory may be empty or not exist"
