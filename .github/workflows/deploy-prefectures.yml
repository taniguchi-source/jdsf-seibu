# 府県連盟サイト 一括デプロイ（共通コード方式）
#
# preftest/ の管理システム一式を、各府県サブドメインへそのまま配信する。
# 全府県が同一コードを共有し、府県ごとの違い（連盟名・テーマ色・コンテンツ・
# カルーセル画像）はサーバー側 data/・uploads/（管理画面で編集）で持つ。
#
# ■ 府県を追加するには:  下の matrix.sub に <サブドメイン名> を1行足すだけ。
# ■ 実行は手動のみ（テスト中の変更が本番府県へ自動波及しないようにするため）:
#     全府県      : Actions →「Deploy prefectures to XServer」→ Run workflow
#     特定府県のみ: 同上の only に "osaka,shiga" のようにカンマ区切りで指定
#
# 前提: 各サブドメインが XServer で作成済み（DNS反映済み）であること。
#       未作成/未反映の府県はそのジョブだけ失敗する（他府県には影響しない）。

name: Deploy prefectures to XServer

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'デプロイ対象をカンマ区切りで指定（空＝全府県）例: osaka,shiga'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ${{ matrix.sub }}
    strategy:
      fail-fast: false
      matrix:
        sub:
          - hiroshima
          - hyogo
          - kagawa
          - kochi
          - okayama
          - osaka
          - shiga
          - shimane
          - tokushima
          - tottori
          - wakayama
          - ehime
          - kyoto
          - lesson
          - naraken
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate (only フィルタ判定)
        id: gate
        run: |
          ONLY=$(echo "${{ github.event.inputs.only }}" | tr -d ' ')
          SUB="${{ matrix.sub }}"
          if [ -z "$ONLY" ] || echo ",$ONLY," | grep -q ",$SUB,"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "⏭  $SUB は only='$ONLY' に含まれないためスキップ"
          fi

      - name: Install lftp
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get install -y lftp

      # LINE等のリンクプレビュー対策：クローラはJSを実行せず生HTMLを読むため、
      # 配信直前に各府県の正式名称を <title>/<meta>/OGP へ焼き込む。
      # 名称はその府県の「現在の」data/sitename.json（サーバー側の真実）から取得。
      # 取得不可 or 雛形のままなら焼き込まず、従来どおりJSが差し替える（安全側）。
      - name: Bake federation name into meta tags (LINE preview)
        if: steps.gate.outputs.go == 'true'
        run: |
          SUB="${{ matrix.sub }}"
          PLACEHOLDER="テストダンススポーツ連盟"
          NAME=$(curl -fsS --max-time 20 "https://${SUB}.jdsf-seibu.com/data/sitename.json" | jq -r '.name // empty' 2>/dev/null || true)
          if [ -z "$NAME" ] || [ "$NAME" = "$PLACEHOLDER" ]; then
            echo "ℹ️  $SUB: サイト名が取得できない/雛形のまま → 焼き込みスキップ（JSが差し替え）"
            exit 0
          fi
          echo "🔤 $SUB: メタ情報に「$NAME」を焼き込みます"
          NAME_ESC=$(printf '%s' "$NAME" | sed -e 's/[\/&\\]/\\&/g')   # sed置換用に / & \ をエスケープ
          for f in preftest/index.html preftest/news.html preftest/contact.html \
                   preftest/page.html preftest/page1.html preftest/page2.html \
                   preftest/page3.html preftest/page4.html preftest/page5.html; do
            [ -f "$f" ] && sed -i "s/${PLACEHOLDER}/${NAME_ESC}/g" "$f"
          done
          echo "✅ $SUB: 焼き込み完了（生HTMLに実名が入りLINEプレビューが正しくなります）"

      - name: Deploy preftest/ to ${{ matrix.sub }}.jdsf-seibu.com
        if: steps.gate.outputs.go == 'true'
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                set net:timeout 60; set net:max-retries 5; set net:reconnect-interval-base 5; \
                set xfer:clobber on; set cmd:fail-exit yes; \
                mirror -R --delete --verbose=1 \
                  --exclude '^data/' \
                  --exclude '^uploads/' \
                  preftest/ \
                  /jdsf-seibu.com/public_html/${{ matrix.sub }}.jdsf-seibu.com/; \
                quit"

      - name: Ensure data/ and uploads/ directories exist (PHP write targets)
        if: steps.gate.outputs.go == 'true'
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                set net:timeout 30; set cmd:fail-exit no; \
                mkdir -p /jdsf-seibu.com/public_html/${{ matrix.sub }}.jdsf-seibu.com/data; \
                mkdir -p /jdsf-seibu.com/public_html/${{ matrix.sub }}.jdsf-seibu.com/uploads; \
                mkdir -p /jdsf-seibu.com/public_html/${{ matrix.sub }}.jdsf-seibu.com/uploads/slides; \
                quit" || true

      # 認証マスター秘密を各府県の data/auth_secret.php へ配置（ブラウザにもGitにも出さない）
      - name: Write auth master secret
        if: steps.gate.outputs.go == 'true'
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          AUTH_MASTER_SECRET: ${{ secrets.AUTH_MASTER_SECRET }}
        run: |
          mkdir -p _secret
          printf '<?php return %s;\n' "'$AUTH_MASTER_SECRET'" > _secret/auth_secret.php
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:timeout 30; set cmd:fail-exit yes; \
                put _secret/auth_secret.php -o /jdsf-seibu.com/public_html/${{ matrix.sub }}.jdsf-seibu.com/data/auth_secret.php; \
                quit"
          rm -rf _secret
