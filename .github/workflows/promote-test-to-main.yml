name: Promote test.jdsf-seibu.com to jdsf-seibu.com

on:
  workflow_dispatch:   # 手動実行のみ（重要：実行前にバックアップを確認すること）

jobs:
  promote:
    runs-on: ubuntu-latest
    name: test.jdsf-seibu.com → jdsf-seibu.com (本番化)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy new site to jdsf-seibu.com root
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                mirror -R --ignore-time \
                  --exclude ^\.git \
                  --exclude ^\.github \
                  --exclude ^scripts \
                  --exclude ^preftest \
                  --exclude ^pref \
                  . \
                  /jdsf-seibu.com/public_html/; \
                quit"
