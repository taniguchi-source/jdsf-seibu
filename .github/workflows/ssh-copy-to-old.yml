name: SSH Copy WordPress to old.jdsf-seibu.com

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    name: サーバー内でWP→old にコピー（SSH）
    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 10022 sv16504.xserver.jp >> ~/.ssh/known_hosts

      - name: Server-side copy via SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 10022 jdsfseibu@sv16504.xserver.jp \
            "rsync -a --exclude=old.jdsf-seibu.com --exclude=test.jdsf-seibu.com --exclude=preftest.jdsf-seibu.com \
             /home/jdsfseibu/jdsf-seibu.com/public_html/ \
             /home/jdsfseibu/jdsf-seibu.com/public_html/old.jdsf-seibu.com/"
