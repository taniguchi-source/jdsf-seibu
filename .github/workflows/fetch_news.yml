name: Update News Data

on:
  # スプレッドシート連携を廃止し役員ページからの手動投稿に移行（2026-06-03）
  # schedule:
  #   - cron: '30 21 * * *'  # 毎日 06:30 JST
  workflow_dispatch:  # 必要時は手動実行可能

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch news data（お知らせ）
        run: python scripts/fetch_news.py

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3; do ssh-keyscan -p 10022 sv16504.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done; true

      - name: Deploy news.json to production via rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            data/news.json \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/data/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
