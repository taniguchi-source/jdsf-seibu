name: Update News Data

on:
  schedule:
    - cron: '30 21 * * *'  # 毎日 06:30 JST（fetch_competitions と時間をずらす）
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch news data（お知らせ）
        run: python scripts/fetch_news.py

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 sv16504.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy news.json to production via rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            data/news.json \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/data/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
