name: Update News Data

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 06:00 JST
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch news data（お知らせ）
        run: python scripts/fetch_news.py

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Upload news.json to XServer
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; put -O /jdsf-seibu.com/public_html/test.jdsf-seibu.com/data/ data/news.json; quit"
