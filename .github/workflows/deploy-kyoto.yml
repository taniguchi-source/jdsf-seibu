name: Deploy kyoto to XServer

on:
  push:
    branches: [ master, main ]
    paths:
      - 'kyoto/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to XServer (kyoto.jdsf-seibu.com)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy kyoto/ to XServer
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                set net:timeout 30; set net:max-retries 3; \
                mirror -R --delete \
                  --exclude '^data/' \
                  --exclude '^uploads/' \
                  kyoto/ \
                  /jdsf-seibu.com/public_html/kyoto.jdsf-seibu.com/; \
                quit"

      - name: Ensure data/ and uploads/ directories exist (PHP write targets)
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                set net:timeout 30; set cmd:fail-exit no; \
                mkdir -p /jdsf-seibu.com/public_html/kyoto.jdsf-seibu.com/data; \
                mkdir -p /jdsf-seibu.com/public_html/kyoto.jdsf-seibu.com/uploads; \
                mkdir -p /jdsf-seibu.com/public_html/kyoto.jdsf-seibu.com/uploads/slides; \
                quit" || true
