name: Deploy to jdsf-seibu.com (本番)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: rsync → jdsf-seibu.com（本番）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 sv16504.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null
          echo "=== Key fingerprint ==="
          ssh-keygen -l -f ~/.ssh/deploy_key
          echo "=== SSH test ==="
          ssh -i ~/.ssh/deploy_key -p 10022 -v -o StrictHostKeyChecking=no jdsfseibu@sv16504.xserver.jp "echo SSH_OK" 2>&1 | tail -10 || true

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='preftest/' \
            --exclude='pref/' \
            --filter='protect test.jdsf-seibu.com/' \
            --filter='protect old.jdsf-seibu.com/' \
            --filter='protect nara.jdsf-seibu.com/' \
            --filter='protect nara1.jdsf-seibu.com/' \
            --filter='protect hyogo.jdsf-seibu.com/' \
            --filter='protect hiroshima.jdsf-seibu.com/' \
            ./ jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
