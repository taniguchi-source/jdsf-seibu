name: Deploy to jdsf-seibu.com (本番)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: rsync → jdsf-seibu.com（本番）
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # XServer側のSSH一時制限でkeyscanが落ちても配信を止めない（後続はStrictHostKeyChecking=no）
          for i in 1 2 3; do ssh-keyscan -p 10022 sv16504.xserver.jp >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done; true

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='preftest/' \
            --exclude='preftest.jdsf-seibu.com/' \
            --exclude='kyoto/' \
            --exclude='kyoto.jdsf-seibu.com/' \
            --exclude='pref/' \
            --exclude='test.jdsf-seibu.com/' \
            --exclude='old.jdsf-seibu.com/' \
            --exclude='nara.jdsf-seibu.com/' \
            --exclude='nara1.jdsf-seibu.com/' \
            --exclude='naraken.jdsf-seibu.com/' \
            --exclude='hyogo.jdsf-seibu.com/' \
            --exclude='hiroshima.jdsf-seibu.com/' \
            --exclude='kagawa.jdsf-seibu.com/' \
            --exclude='kochi.jdsf-seibu.com/' \
            --exclude='okayama.jdsf-seibu.com/' \
            --exclude='osaka.jdsf-seibu.com/' \
            --exclude='shiga.jdsf-seibu.com/' \
            --exclude='shimane.jdsf-seibu.com/' \
            --exclude='tokushima.jdsf-seibu.com/' \
            --exclude='tottori.jdsf-seibu.com/' \
            --exclude='wakayama.jdsf-seibu.com/' \
            --exclude='ehime.jdsf-seibu.com/' \
            --exclude='lesson.jdsf-seibu.com/' \
            --exclude='docs/meetings/' \
            --exclude='data/news.json' \
            --exclude='data/news_archive.json' \
            --exclude='data/competitions_seibu.json' \
            --exclude='data/events_seibu.json' \
            --exclude='data/officers_news.json' \
            --exclude='data/officers_notices.json' \
            --exclude='data/references.json' \
            --exclude='data/home_quicklinks.json' \
            --exclude='data/home_hero.json' \
            --exclude='data/home_banner.json' \
            --exclude='data/gemini_key.php' \
            --exclude='data/auth.php' \
            --exclude='data/auth_secret.php' \
            --exclude='data/login_attempts.php' \
            --exclude='uploads/' \
            ./ jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/

      # 認証マスター秘密を data/auth_secret.php へ配置（ブラウザにもGitにも出さない）
      - name: Write auth master secret
        env:
          AUTH_MASTER_SECRET: ${{ secrets.AUTH_MASTER_SECRET }}
        run: |
          printf '<?php return %s;\n' "'$AUTH_MASTER_SECRET'" > auth_secret.php
          scp -i ~/.ssh/deploy_key -P 10022 -o StrictHostKeyChecking=no \
            auth_secret.php \
            jdsfseibu@sv16504.xserver.jp:/home/jdsfseibu/jdsf-seibu.com/public_html/data/auth_secret.php
          rm -f auth_secret.php

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
