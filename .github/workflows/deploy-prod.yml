name: Deploy to jdsf-seibu.com (本番)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: GitHubリポジトリ → jdsf-seibu.com（本番）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to XServer (jdsf-seibu.com)
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "jdsfseibu,$FTP_PASS" ftp://sv16504.xserver.jp \
            -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; \
                mirror -R --transfer-all \
                  --exclude ^\.git \
                  --exclude ^\.github \
                  --exclude ^scripts \
                  --exclude ^preftest \
                  --exclude ^pref \
                  . \
                  /jdsf-seibu.com/public_html/jdsf-seibu.com/; \
                quit"
