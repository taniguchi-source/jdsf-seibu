<script>
(function () {
  'use strict';

  var SITE_ID = '2';
  var TOKEN   = 'preftest2026';

  /* ===== ユーティリティ ===== */
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function parseCSV(text) {
    var rows = [];
    var lines = text.split(/\r?\n/);
    for (var li = 0; li < lines.length; li++) {
      var line = lines[li];
      if (!line.trim()) continue;
      var row = [], inQ = false, cell = '';
      for (var ci = 0; ci < line.length; ci++) {
        var c = line[ci];
        if (c === '"') {
          if (inQ && line[ci+1] === '"') { cell += '"'; ci++; }
          else { inQ = !inQ; }
        } else if (c === ',' && !inQ) {
          row.push(cell); cell = '';
        } else { cell += c; }
      }
      row.push(cell);
      rows.push(row);
    }
    return rows;
  }

  function csvToTable(csv) {
    var rows = parseCSV(csv);
    if (!rows || rows.length === 0) return '<p style="color:var(--text-light);">データがありません</p>';
    var startRow = 0;
    if (rows.length > 1) {
      var ne = rows[0].filter(function(c){ return c.trim() !== ''; });
      if (ne.length <= 1) startRow = 1;
    }
    if (startRow >= rows.length) return '<p style="color:var(--text-light);">データがありません</p>';
    var headerRow = rows[startRow];
    var dataRows  = rows.slice(startRow + 1);
    var hasSection = headerRow.length > 0 && headerRow[0].trim() === '';
    var colStart   = hasSection ? 1 : 0;
    var html = '<div class="sheet-table-wrap"><table class="sheet-table"><thead><tr>';
    for (var hi = colStart; hi < headerRow.length; hi++) {
      html += '<th>' + escHtml(headerRow[hi]) + '</th>';
    }
    html += '</tr></thead><tbody>';
    var curSection = '', rowCount = 0;
    dataRows.forEach(function(row) {
      if (row.every(function(c){ return !c.trim(); })) return;
      var secVal = hasSection ? (row[0] || '').trim() : '';
      if (hasSection && secVal && secVal !== curSection) {
        curSection = secVal;
        html += '<tr class="sheet-section-row"><td colspan="' + (headerRow.length - colStart) + '">'
          + escHtml(secVal) + '</td></tr>';
      }
      html += '<tr class="' + (rowCount % 2 === 0 ? 'sheet-row-even' : 'sheet-row-odd') + '">';
      for (var di = colStart; di < headerRow.length; di++) {
        html += '<td>' + escHtml(row[di] || '') + '</td>';
      }
      html += '</tr>';
      rowCount++;
    });
    return html + '</tbody></table></div>';
  }

  /* ===== スプレッドシート取得 ===== */
  function fetchSheet(sheetUrl, sheetName, targetEl) {
    var fd = new FormData();
    fd.append('token',      TOKEN);
    fd.append('sheet_url',  sheetUrl);
    fd.append('sheet_name', sheetName || '');
    fetch('api/fetch_sheet.php', { method:'POST', body:fd })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok && res.csv) {
          targetEl.innerHTML = csvToTable(res.csv);
        } else {
          var dbgHtml = res.debug
            ? '<br><small style="font-size:.72rem;color:#6B7280;word-break:break-all;">🔧 ' + escHtml(res.debug) + '</small>'
            : '';
          targetEl.innerHTML = '<p style="color:#B91C1C;">⚠ ' + escHtml(res.error || 'データの取得に失敗しました') + '</p>' + dbgHtml;
        }
      })
      .catch(function() {
        targetEl.innerHTML = '<p style="color:#B91C1C;">⚠ 通信エラーが発生しました</p>';
      });
  }

  /* ===== コンテンツ描画（ボディ生成ヘルパー） ===== */
  function buildBodyEl(item) {
    var bodyEl = document.createElement('div');
    if (item.type === 'sheet') {
      bodyEl.className = 'loading-text';
      bodyEl.textContent = '⏳ スプレッドシートを読み込み中...';
    } else if (item.type === 'image' || (item.type === 'file' && (item.file_url || '').match(/\.(jpe?g|png|gif)$/i))) {
      var fUrl = item.file_url || '';
      if (fUrl) {
        var img = document.createElement('img');
        img.src   = fUrl;
        img.alt   = item.title || '';
        img.style.cssText = 'max-width:100%;height:auto;border-radius:8px;display:block;';
        bodyEl.appendChild(img);
      } else {
        bodyEl.className = 'content-block-body';
        bodyEl.textContent = '（画像は未設定です）';
      }
    } else if (item.type === 'pdf' || (item.type === 'file' && (item.file_url || '').match(/\.pdf$/i))) {
      var fUrl = item.file_url || '';
      if (fUrl) {
        bodyEl.innerHTML =
          '<embed src="' + escHtml(fUrl) + '" type="application/pdf" style="width:100%;height:640px;border-radius:8px;border:1px solid var(--border);">'
          + '<p style="text-align:right;margin:6px 0 0;font-size:.8125rem;">'
          + '<a href="' + escHtml(fUrl) + '" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600;">🔗 PDFを別タブで開く</a></p>';
      } else {
        bodyEl.className = 'content-block-body';
        bodyEl.textContent = '（PDFは未設定です）';
      }
    } else if (item.type === 'file') {
      var fUrl = item.file_url || '';
      bodyEl.className = 'content-block-body';
      bodyEl.textContent = fUrl ? fUrl : '（ファイルは未設定です）';
    } else if (item.type === 'link') {
      var lUrl   = item.link_url   || '';
      var lLabel = item.link_label || item.title || '';
      if (lUrl) {
        bodyEl.innerHTML =
          '<a href="' + escHtml(lUrl) + '" target="_blank" rel="noopener" class="link-btn">'
          + '🔗 ' + escHtml(lLabel || lUrl) + '　→'
          + '</a>'
          + '<p class="link-btn-sub">新しいタブで開きます</p>';
      } else {
        bodyEl.className = 'content-block-body';
        bodyEl.textContent = '（リンクURLは未設定です）';
      }
    } else {
      bodyEl.className = 'content-block-body';
      bodyEl.textContent = item.body || '（内容はまだ設定されていません）';
    }
    return bodyEl;
  }

  function appendWithFetch(item, bodyEl, container) {
    container.appendChild(bodyEl);
    if (item.type === 'sheet' && item.sheet_url) {
      fetchSheet(item.sheet_url, item.sheet_name, bodyEl);
    }
  }

  /* ===== コンテンツ描画 ===== */
  function renderContents(items) {
    var wrap = document.getElementById('contents-wrap');
    if (!wrap) return;
    if (!items || items.length === 0) {
      wrap.innerHTML = '<div style="text-align:center;padding:60px 20px;"><p style="color:var(--text-light);">現在、コンテンツはありません。</p></div>';
      return;
    }
    wrap.innerHTML = '';

    /* サブコンテンツをグループ化: is_sub=true は直前の通常コンテンツに束ねる */
    var groups = [];
    var cur = null;
    items.forEach(function(item) {
      if (!item.is_sub) {
        cur = { main: item, subs: [] };
        groups.push(cur);
      } else {
        if (cur) { cur.subs.push(item); }
        else     { cur = { main: item, subs: [] }; groups.push(cur); }
      }
    });

    groups.forEach(function(group) {
      var block = document.createElement('div');
      block.className = 'content-block';

      /* メインタイトル・ボディ */
      var m = group.main;
      if (m.type === 'link' && m.link_url) {
        /* リンクタイプ: タイトルをボタンとして表示 */
        var lBtn = document.createElement('a');
        lBtn.href      = m.link_url;
        lBtn.target    = '_blank';
        lBtn.rel       = 'noopener';
        lBtn.className = 'link-title-btn';
        lBtn.textContent = '🔗 ' + (m.title || 'リンク') + '　→';
        block.appendChild(lBtn);
        if (m.link_label) {
          var lDesc = document.createElement('p');
          lDesc.className   = 'link-btn-sub';
          lDesc.textContent = m.link_label;
          block.appendChild(lDesc);
        }
        var lNote = document.createElement('p');
        lNote.className   = 'link-btn-sub';
        lNote.textContent = '新しいタブで開きます';
        block.appendChild(lNote);
      } else {
        var titleIcon = m.type === 'sheet' ? '📊 ' : ((m.type === 'file' || m.type === 'image') ? '🖼️ ' : (m.type === 'pdf' ? '📄 ' : (m.type === 'link' ? '🔗 ' : '📝 ')));
        var titleEl = document.createElement('h2');
        titleEl.className = 'content-block-title';
        titleEl.textContent = titleIcon + (m.title || 'コンテンツ');
        block.appendChild(titleEl);
        appendWithFetch(m, buildBodyEl(m), block);
      }

      /* サブコンテンツ */
      if (group.subs.length > 0) {
        var subList = document.createElement('div');
        subList.className = 'sub-content-list';
        group.subs.forEach(function(sub) {
          var subItem = document.createElement('div');
          subItem.className = 'sub-content-item';
          if (sub.type === 'link' && sub.link_url) {
            /* サブリンクタイプ: タイトルをボタンとして表示 */
            var slBtn = document.createElement('a');
            slBtn.href      = sub.link_url;
            slBtn.target    = '_blank';
            slBtn.rel       = 'noopener';
            slBtn.className = 'link-sub-title-btn';
            slBtn.textContent = '🔗 ' + (sub.title || 'リンク') + '　→';
            subItem.appendChild(slBtn);
            if (sub.link_label) {
              var slDesc = document.createElement('p');
              slDesc.className   = 'link-btn-sub';
              slDesc.style.marginTop = '6px';
              slDesc.textContent = sub.link_label;
              subItem.appendChild(slDesc);
            }
            var slNote = document.createElement('p');
            slNote.className   = 'link-btn-sub';
            slNote.textContent = '新しいタブで開きます';
            subItem.appendChild(slNote);
          } else {
            var subIcon = sub.type === 'sheet' ? '📊 ' : ((sub.type === 'file' || sub.type === 'image') ? '🖼️ ' : (sub.type === 'pdf' ? '📄 ' : (sub.type === 'link' ? '🔗 ' : '📝 ')));
            var subTitle = document.createElement('h3');
            subTitle.className = 'sub-content-title';
            subTitle.textContent = subIcon + (sub.title || 'サブコンテンツ');
            subItem.appendChild(subTitle);
            appendWithFetch(sub, buildBodyEl(sub), subItem);
          }
          subList.appendChild(subItem);
        });
        block.appendChild(subList);
      }

      wrap.appendChild(block);
    });
  }

  /* ===== コンテンツ読み込み ===== */
  fetch('data/contents.json?_=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : {}; })
    .then(function(data) {
      var items = (data[SITE_ID] || []).filter(function(item) {
        return item.enabled !== false;
      });
      renderContents(items);
    })
    .catch(function() {
      var wrap = document.getElementById('contents-wrap');
      if (wrap) wrap.innerHTML = '<p style="color:#B91C1C;">⚠ コンテンツの読み込みに失敗しました。</p>';
    });

  /* ===== ナビゲーション動的ロード ===== */
  fetch('data/nav.json?_=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data || !Array.isArray(data.links)) return;
      // ページタイトル更新
      var me = data.links.filter(function(l) { return String(l.id) === SITE_ID; })[0];
      if (me && me.name) {
        var titleEl = document.getElementById('page-title');
        if (titleEl) titleEl.textContent = me.name;
        document.title = me.name + '｜テストダンススポーツ連盟';
      }
      // ナビ生成
      var container = document.getElementById('dynamic-nav');
      if (!container) return;
      var html = '';
      data.links.forEach(function(link) {
        if (!link.enabled) return;
        var url  = String(link.url  || '#').replace(/"/g, '%22');
        var name = escHtml(link.name || '');
        var cls  = String(link.id) === SITE_ID ? ' active' : '';
        html += '<a href="' + url + '" class="nav-link' + cls + '">' + name + '</a>';
      });
      container.innerHTML = html;
    })
    .catch(function() {});

  /* ===== ハンバーガーメニュー ===== */
  var hamburger = document.querySelector('.hamburger');
  var nav       = document.querySelector('.site-nav');
  if (hamburger && nav) {
    hamburger.addEventListener('click', function() {
      var open = nav.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', open);
    });
  }
}());
</script>

<script>
/* ===== サイト名 動的反映（data/sitename.json） ===== */
(function(){
  fetch('data/sitename.json?_=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || !d.name) return;
      var els = document.querySelectorAll('.header-logo-text .name, .footer-logo-name');
      for (var i=0;i<els.length;i++) els[i].textContent = d.name;
      var cps = document.querySelectorAll('.footer-bottom span');
      for (var j=0;j<cps.length;j++){ if (/All rights reserved|©/.test(cps[j].textContent)) cps[j].textContent = cps[j].textContent.replace(/テストダンススポーツ連盟/g, d.name); }
    })
    .catch(function(){});
})();
/* ===== フッター サイトマップ 動的反映（data/nav.json） ===== */
(function(){
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var h4s = document.querySelectorAll('.site-footer h4'), ul = null;
  for (var i=0;i<h4s.length;i++){ if (h4s[i].textContent.indexOf('サイトマップ') >= 0) { ul = h4s[i].parentNode.querySelector('ul'); break; } }
  if (!ul) return;
  fetch('data/nav.json?_=' + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      var html = '<li><a href="index.html">ホーム</a></li><li><a href="news.html">お知らせ一覧</a></li>';
      if (d && Array.isArray(d.links)) {
        d.links.forEach(function(l){ if (!l.enabled) return; html += '<li><a href="' + String(l.url||'#').replace(/"/g,'%22') + '">' + esc(l.name||'') + '</a></li>'; });
      }
      html += '<li><a href="contact.html">お問い合わせ</a></li>';
      ul.innerHTML = html;
    })
    .catch(function(){});
