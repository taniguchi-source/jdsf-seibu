<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>欠場者一覧 | 競技会受付システム</title>
<link rel="icon" href="favicon.ico">
<style>
  :root{--primary:#123262;--bg:#f4f5f7;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#e0e2e7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,-apple-system,"Segoe UI",sans-serif}
  header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center}
  header h1{font-size:16px;margin:0}
  header a{color:#fff;font-size:13px;margin-left:auto;text-decoration:none;opacity:.85}
  /* 受付システムと同じ並びのタブ。別ページなので中身はリンクで、押すと受付システムのその画面が開く。 */
  nav.tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--border);
    padding:6px 8px 0;overflow-x:auto}
  nav.tabs a,nav.tabs span{flex:none;padding:10px 14px;color:var(--muted);font-weight:700;font-size:14px;
    border-bottom:3px solid transparent;text-decoration:none;white-space:nowrap}
  nav.tabs a:hover{color:var(--text)}
  nav.tabs .active{color:var(--primary);border-bottom-color:var(--primary)}
  main{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  button{font-size:15px;font-weight:700;padding:10px 16px;border:none;border-radius:8px;
    background:var(--primary);color:#fff;cursor:pointer}
  button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
  select{font-size:16px;padding:10px;border:1px solid var(--border);border-radius:8px;width:100%;background:#fff}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  h2{font-size:18px;margin:0 0 2px}
  /* 欠場者の背番号だけを横に並べる。進行席で読み上げるので大きく出す。 */
  .bibs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .bib{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;
    font-size:30px;font-weight:800;line-height:1;padding:8px 12px;border:2px solid var(--border);
    border-radius:8px;background:#fff;color:var(--primary)}
  /* 背番号在庫を確認した組は、ひと目で区別できるようにする */
  .bib.checked{border-color:#16a34a;background:#f0fdf4}
  .bib .who{font-size:11px;font-weight:700;line-height:1.2;color:#16a34a;white-space:nowrap}
  .bib .who.none{color:var(--muted)}
  .block{margin-bottom:16px}
  .no-break{padding-bottom:8px}
  /* ST初期振分。済んだ区分は受付システム側の受付・取消を止める。 */
  button.assign{font-size:14px;padding:6px 12px;margin-left:10px;vertical-align:middle;
    background:#c2410c;color:#fff;border:2px solid #9a3412}
  button.assign.done{background:#127a3b;border-color:#0f5f2e;color:#fff}
  .hidden{display:none !important}
  /* 押し間違えると受付が止まるので、確認は はい/いいえ ではなくチェックで確かめる */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:50}
  .modal-box{background:var(--card);border-radius:14px;padding:20px 22px;max-width:540px;width:100%;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
  .modal-box h2{margin:0 0 10px;font-size:19px}
  .modal-box .q{font-weight:700;margin-top:14px;font-size:15px}
  .checkbox-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
  .checkbox-row input[type=checkbox]{width:20px;height:20px}
  /* チェックが入るまで OK は押せない。押せないことが見て分かるようにする */
  button:disabled{opacity:.4;cursor:not-allowed}
  .modal-box .alert{background:#fef3c7;color:#b45309;border-left:5px solid #b45309;
    padding:10px 12px;border-radius:0 8px 8px 0;margin-top:12px;font-weight:700;font-size:14px}
  .print-only{display:none}
  @media print{
    header,.no-print{display:none !important}
    .print-only{display:inline}
    body{background:#fff}
    main{max-width:none;padding:0}
    .card{border:none;padding:0}
    .bib{border-color:#999}
  }
</style>
</head>
<body>
<header>
  <h1>欠場者一覧</h1>
  <a href="uketsuke-manual.html" target="_blank" rel="noopener" style="margin-left:auto">マニュアル</a>
  <a href="uketsuke.html" style="margin-left:14px">← 受付システムへ戻る</a>
</header>

<nav class="tabs no-print">
  <a href="uketsuke.html#comp">大会</a>
  <a href="uketsuke.html#roster">名簿</a>
  <a href="uketsuke.html#checkin">受付</a>
  <a href="uketsuke.html#rollcall">欠場報告</a>
  <a href="uketsuke.html#admin">管理</a>
  <span class="active">欠場者一覧</span>
</nav>

<main>
  <div class="card no-print">
    <div id="comp-name" class="muted"></div>
    <div style="height:8px"></div>
    <label for="pick">表示する範囲</label>
    <select id="pick"></select>
    <div style="height:12px"></div>
    <div class="row">
      <button id="b-reload" class="secondary">最新にする</button>
      <button id="b-print">印刷する</button>
      <button id="b-assign-all" class="assign hidden">ST初期振分（この時刻すべて）</button>
      <span class="muted" id="updated"></span>
    </div>
  </div>
  <div id="out"></div>
</main>

<div id="asg-dlg" class="modal hidden no-print">
  <div class="modal-box">
    <h2 id="asg-title"></h2>
    <div id="asg-warn" class="alert hidden"></div>
    <div class="q">あなたは ST ですか</div>
    <label class="checkbox-row"><input type="checkbox" id="asg-c1"><span>はい、私が ST です</span></label>
    <div class="q" id="asg-q2"></div>
    <label class="checkbox-row"><input type="checkbox" id="asg-c2"><span id="asg-c2-label"></span></label>
    <div class="row" style="margin-top:18px">
      <button id="asg-ok" disabled>OK</button>
      <button class="secondary" id="asg-cancel">キャンセル</button>
    </div>
  </div>
</div>

<script>
'use strict';
var DATA = null;
var CSRF = '';
function el(id){ return document.getElementById(id); }
function esc(s){ if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* 区分名が未設定（コードのまま）のとき「JAS JAS」と二重に出さない */
function evLabel(e){ var n = (e && e.name) ? String(e.name).trim() : '';
  return (!n || n === e.code) ? esc(e.code) : esc(e.code) + ' ' + esc(n); }
function qs(k){ var m = new RegExp('[?&]'+k+'=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

var id = qs('id');
if (!id) {
  document.body.innerHTML = '<p style="padding:20px">大会が指定されていません。'
    + '<a href="uketsuke.html">受付システム</a>から開いてください。</p>';
} else {
  load();
}

function load(){
  return fetch('api/uketsuke_get.php?id=' + encodeURIComponent(id) + '&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      var first = (DATA === null);
      DATA = d;
      CSRF = d.csrf || '';
      el('comp-name').textContent = d.name + (d.date ? '（' + d.date + '）' : '');
      if (first) buildPicker();
      el('updated').textContent = '最終更新 ' + new Date().toLocaleTimeString('ja-JP');
      render();
    })
    .catch(function(e){
      document.body.innerHTML = '<p style="padding:20px">読み込めませんでした（' + esc(e.message)
        + '）。<a href="uketsuke.html">受付システム</a>でログインしてから開いてください。</p>';
    });
}

/* 受付締切が同じ区分はまとめて呼び出すので、締切ごとに選べるようにする。
   値は t:<時刻> で締切ごと、e:<コード> で区分ごと。 */
function deadlines(){
  var seen = {}, out = [];
  (DATA.events || []).forEach(function(e){
    var t = (e.start_time || '').trim();
    if (!t) return;
    if (!seen[t]) { seen[t] = []; out.push(t); }
    seen[t].push(e);
  });
  out.sort();
  return out.map(function(t){ return {time: t, events: seen[t]}; });
}

function buildPicker(){
  var dl = deadlines();
  var html = '';
  if (dl.length) {
    html += '<optgroup label="受付締切ごと（その時刻の区分をそれぞれ表示）">'
      + dl.map(function(g){
          return '<option value="t:' + esc(g.time) + '">' + esc(g.time) + '　'
            + esc(g.events.map(function(e){ return e.code; }).join(', ')) + '</option>';
        }).join('')
      + '</optgroup>';
  }
  html += '<optgroup label="区分ごと">'
    + (DATA.events || []).map(function(e){
        return '<option value="e:' + esc(e.code) + '">' + evLabel(e)
          + (e.start_time ? '（' + esc(e.start_time) + '）' : '') + '</option>';
      }).join('')
    + '</optgroup>';
  el('pick').innerHTML = html;
  el('pick').addEventListener('change', render);
}

/* 指定した区分の欠場者。受付は区分ごとなので、
   その区分を受付していない組が欠場になる。
   締切ごとの表示では複数区分にまたがるので、背番号で重複を取り除く。 */
function absentFor(codes){
  var done = {};
  (DATA.checkins || []).forEach(function(c){ done[c.bib + ':' + c.code] = true; });
  var seen = {}, out = [];
  (DATA.roster || []).forEach(function(r){
    if (seen[r.bib]) return;
    var hit = (r.events || []).some(function(c){
      return codes.indexOf(c) !== -1 && !done[r.bib + ':' + c];
    });
    if (!hit) return;
    seen[r.bib] = true;
    out.push(r);
  });
  out.sort(function(a, b){ return a.bib - b.bib; });
  return out;
}
function entryCount(codes){
  var seen = {}, n = 0;
  (DATA.roster || []).forEach(function(r){
    var hit = (r.events || []).some(function(c){ return codes.indexOf(c) !== -1; });
    if (!hit || seen[r.bib]) return;
    seen[r.bib] = true;
    n++;
  });
  return n;
}

/* 背番号在庫の確認記録（背番号 → {by, at}） */
function stockMap(){
  var m = {};
  (DATA.stock || []).forEach(function(s){ m[s.bib] = s; });
  return m;
}
/* 背番号ひとつぶん。在庫を確認済みなら緑にして、確認した担当者名を添える */
function bibHtml(r, stock){
  var s = stock[r.bib];
  return '<span class="bib' + (s ? ' checked' : '') + '">' + esc(r.bib)
    + (s ? '<span class="who">✓ ' + esc(s.by || '確認済') + '</span>'
         : '<span class="who none">未確認</span>')
    + '</span>';
}

/* ST初期振分（区分ごと）。済みにすると、受付システム側でその区分の受付・取消を止める。 */
function assignMap(){
  var m = {};
  (DATA.assign || []).forEach(function(a){ m[a.code] = a; });
  return m;
}
/* 欠場処理チェック担当者名（受付システム側で大会ごとに端末に記憶している） */
function absentBy(){
  try { return localStorage.getItem('uk_by_absent:' + id) || ''; } catch (e) { return ''; }
}
function assignHtml(code){
  var a = assignMap()[code];
  return '<button type="button" class="assign no-print' + (a ? ' done' : '') + '" data-assign="' + esc(code) + '">'
    + 'ST初期振分：' + (a ? '完了' : '未') + '</button>'
    + '<span class="print-only muted">　ST初期振分：' + (a ? '完了' : '未') + '</span>';
}
function bindAssign(){
  el('out').querySelectorAll('[data-assign]').forEach(function(b){
    b.addEventListener('click', function(){
      var code = b.dataset.assign;
      var a = assignMap()[code];
      /* 本当に来ていないかを確かめないまま振分を締めてしまわないよう、押す前に知らせる */
      var warn = '';
      if (!a) {
        var stock = stockMap();
        var un = absentFor([code]).filter(function(r){ return !stock[r.bib]; })
                                  .map(function(r){ return r.bib; });
        if (un.length) {
          warn = '背番号在庫のチェックが入っていない組があります（背番号 ' + un.join('・') + '）';
          alert(warn + '。\n本当に来ていないかを確かめてから進めてください。');
        }
      }
      openAssignDlg(code, !a, function(){ sendAssign(b, code, !a); }, warn);
    });
  });
}
/* 押し間違えるとその区分の受付が止まるので、はい/いいえ ではなく
   「自分がSTであること」「振分が済んだこと」の2つにチェックを入れてもらう。 */
var ASG_RUN = null;
function openAssignDlg(code, on, run, warn){
  ASG_RUN = run;
  el('asg-warn').textContent = warn || '';
  el('asg-warn').classList.toggle('hidden', !warn);
  el('asg-title').textContent = on
    ? code + ' の ST初期振分を「完了」にします'
    : code + ' の ST初期振分を「未」に戻します';
  el('asg-q2').textContent = on ? '初期振分は済みましたか' : 'この区分の受付を再開しますか';
  el('asg-c2-label').textContent = on
    ? 'はい、済みました（以後この区分の受付・取消はできません）'
    : 'はい、初期振分をやり直します（この区分の受付・取消をできる状態に戻します）';
  el('asg-c1').checked = false;
  el('asg-c2').checked = false;
  el('asg-ok').disabled = true;
  el('asg-dlg').classList.remove('hidden');
}
function closeAssignDlg(){ ASG_RUN = null; el('asg-dlg').classList.add('hidden'); }
function syncAsgOk(){ el('asg-ok').disabled = !(el('asg-c1').checked && el('asg-c2').checked); }
if (el('asg-dlg')) {   /* 大会IDが無いときはページの中身ごと差し替えているので、その時は何もしない */
  el('asg-c1').addEventListener('change', syncAsgOk);
  el('asg-c2').addEventListener('change', syncAsgOk);
  el('asg-cancel').addEventListener('click', closeAssignDlg);
  el('asg-dlg').addEventListener('click', function(e){ if (e.target === el('asg-dlg')) closeAssignDlg(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !el('asg-dlg').classList.contains('hidden')) closeAssignDlg();
  });
  el('asg-ok').addEventListener('click', function(){
    var run = ASG_RUN;
    closeAssignDlg();
    if (run) run();
  });
}

function postAssign(code, on){
  var fd = new FormData();
  fd.append('id', id);
  fd.append('code', code);
  fd.append('on', on ? '1' : '0');
  fd.append('by', absentBy());
  return fetch('api/uketsuke_assign.php', {method:'POST', body:fd, headers:{'X-CSRF-Token': CSRF}})
    .then(function(r){ return r.json().catch(function(){ return {error:'通信エラー'}; }); })
    .then(function(j){ if (j && j.error) throw new Error(j.message || j.error); return j; });
}
function sendAssign(b, code, on){
  b.disabled = true;
  postAssign(code, on)
    .then(function(){ return load(); })
    .catch(function(e){ b.disabled = false; alert(e.message); });
}

/* 受付締切ごとに出しているときは、その時刻の区分をまとめて完了にできるようにする。
   同じ時刻の区分は同時に初期振分をするので、1つずつ押すのは手間なため。 */
var ASG_ALL = [];
function renderAssignAll(evs){
  var b = el('b-assign-all');
  ASG_ALL = (evs || []).map(function(e){ return e.code; });
  if (!ASG_ALL.length) { b.classList.add('hidden'); return; }
  var asg = assignMap();
  var rest = ASG_ALL.filter(function(c){ return !asg[c]; });
  b.classList.remove('hidden');
  b.textContent = rest.length ? 'ST初期振分（この時刻すべて）' : 'ST初期振分：この時刻はすべて完了';
  b.className = 'assign' + (rest.length ? '' : ' done');
  b.disabled = !rest.length;
}
/* 大会IDが無いときはページの中身ごと差し替えているので、その時は何もしない */
if (el('b-assign-all')) el('b-assign-all').addEventListener('click', function(){
  var asg = assignMap();
  var rest = ASG_ALL.filter(function(c){ return !asg[c]; });
  if (!rest.length) return;
  /* 本当に来ていないかを確かめないまま振分を締めてしまわないよう、押す前に知らせる */
  var stock = stockMap();
  var un = absentFor(rest).filter(function(r){ return !stock[r.bib]; }).map(function(r){ return r.bib; });
  var warn = '';
  if (un.length) {
    warn = '背番号在庫のチェックが入っていない組があります（背番号 ' + un.join('・') + '）';
    alert(warn + '。\n本当に来ていないかを確かめてから進めてください。');
  }
  openAssignDlg(rest.join('・'), true, function(){
    var b = el('b-assign-all');
    b.disabled = true;
    rest.reduce(function(chain, code){
      return chain.then(function(){ return postAssign(code, true); });
    }, Promise.resolve())
      .catch(function(e){ alert(e.message); })
      .then(function(){ return load(); });
  }, warn);
});

/* 1区分ぶんの欠場者を出す */
function blockHtml(e){
  var absent = absentFor([e.code]);
  var total  = entryCount([e.code]);
  var stock  = stockMap();
  var checked = absent.filter(function(r){ return stock[r.bib]; }).length;
  return '<div class="card block">'
    + '<h2>' + evLabel(e) + (e.start_time ? '　<span class="muted">受付締切 ' + esc(e.start_time) + '</span>' : '')
    + assignHtml(e.code) + '</h2>'
    + '<div class="muted">欠場 <b>' + absent.length + '</b> / エントリー ' + total + ' 組'
    + '　背番号在庫の確認済み ' + checked + ' / ' + absent.length + ' 組</div>'
    + (absent.length
        ? '<div class="bibs">' + absent.map(function(r){ return bibHtml(r, stock); }).join('') + '</div>'
        : '<p class="muted">欠場者はいません。</p>')
    + '</div>';
}

function render(){
  var v = el('pick').value;
  var head = '', evs = [];
  if (v.indexOf('t:') === 0) {
    /* 受付締切で選んだときは、その時刻の区分をそれぞれ分けて出す。
       どの区分の欠場かが分からないと、進行席で使えないため。 */
    var t = v.slice(2);
    var g = deadlines().filter(function(x){ return x.time === t; })[0];
    if (!g) { el('out').innerHTML = ''; return; }
    evs = g.events;
    var codes = evs.map(function(e){ return e.code; });
    head = '<div class="card block no-break">'
      + '<h2>受付締切 ' + esc(t) + '　<span class="muted">' + esc(codes.join(', ')) + '</span></h2>'
      + '<div class="muted">' + esc(DATA.name) + (DATA.date ? '（' + esc(DATA.date) + '）' : '')
      + '　この時刻の欠場 <b>' + absentFor(codes).length + '</b> 組（重複を除く） / エントリー '
      + entryCount(codes) + ' 組</div></div>';
  } else {
    var code = v.slice(2);
    var e = (DATA.events || []).filter(function(x){ return x.code === code; })[0];
    if (!e) { el('out').innerHTML = ''; return; }
    evs = [e];
    head = '<div class="card block no-break"><div class="muted">' + esc(DATA.name)
      + (DATA.date ? '（' + esc(DATA.date) + '）' : '') + '</div></div>';
  }
  el('out').innerHTML = head + evs.map(blockHtml).join('');
  bindAssign();
  /* 区分ごとに出しているときは、その区分のボタンが見出しにあるのでまとめボタンは出さない */
  renderAssignAll(v.indexOf('t:') === 0 ? evs : null);
}

el('b-reload').addEventListener('click', function(){ load(); });
el('b-print').addEventListener('click', function(){ window.print(); });
</script>
</body>
</html>
