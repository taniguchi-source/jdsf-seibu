  <style>
    /* ===== 役員 ===== */
    /* 執行部カード */
    .exec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .exec-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .exec-card.is-chief {
      border-top-color: var(--accent, #C9A227);
      background: linear-gradient(135deg, #fffdf4 0%, #fff 100%);
    }
    .exec-role {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--primary-light);
      background: var(--bg-blue);
      display: inline-block;
      padding: 2px 10px;
      border-radius: 100px;
      align-self: flex-start;
    }
    .exec-card.is-chief .exec-role {
      color: #7a5c00;
      background: #fff4cc;
    }
    .exec-name {
      font-size: 1.125rem;
      font-weight: 800;
      color: var(--text-dark);
    }
    .exec-pref {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    /* 部長テーブル */
    .officer-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
      margin-bottom: 40px;
    }
    .officer-table thead tr {
      background: var(--primary);
      color: #fff;
    }
    .officer-table thead th {
      padding: 10px 16px;
      font-weight: 600;
      text-align: left;
    }
    .officer-table tbody tr {
      border-bottom: 1px solid var(--border);
    }
    .officer-table tbody tr:nth-child(even) {
      background: var(--bg-alt, #f8fafc);
    }
    .officer-table tbody td {
      padding: 11px 16px;
      vertical-align: middle;
    }
    .officer-table .td-role {
      font-weight: 700;
      color: var(--primary-light);
      white-space: nowrap;
    }
    .officer-table .td-name {
      font-weight: 700;
      color: var(--text-dark);
    }
    .officer-table .td-pref {
      color: var(--text-light);
    }

    /* 府県会長テーブル */
    .pref-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--bg-blue);
      border-left: 4px solid var(--primary);
      padding: 7px 14px;
      margin-bottom: 0;
      border-radius: 0;
    }
    .pref-table-wrap + .pref-section-title {
      margin-top: 16px;
    }
    .pref-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
    }
    .pref-table thead tr {
      background: #e8edf5;
    }
    .pref-table thead th {
      padding: 8px 16px;
      font-weight: 600;
      color: var(--primary);
      text-align: left;
      font-size: 0.8125rem;
    }
    .pref-table tbody tr {
      border-bottom: 1px solid var(--border);
    }
    .pref-table tbody tr:last-child {
      border-bottom: none;
    }
    .pref-table tbody td {
      padding: 11px 16px;
      vertical-align: middle;
    }
    .pref-table .td-pref-name {
      font-weight: 700;
      color: var(--text-dark);
      white-space: nowrap;
    }
    .pref-table .td-role-name {
      color: var(--text-light);
      font-size: 0.8125rem;
    }
    .pref-table .td-name {
      font-weight: 600;
      color: var(--text-dark);
    }
    .pref-table-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 4px;
    }

    /* 注記 */
    .officers-note {
      font-size: 0.8125rem;
      color: var(--text-light);
      margin-top: 12px;
      text-align: right;
    }

    /* レスポンシブ */
    @media (max-width: 640px) {
      .exec-grid { grid-template-columns: 1fr 1fr; }
      .officer-table, .pref-table { font-size: 0.875rem; }
      .officer-table thead th, .officer-table tbody td,
      .pref-table thead th, .pref-table tbody td { padding: 9px 10px; }
    }
    @media (max-width: 400px) {
      .exec-grid { grid-template-columns: 1fr; }
    }
  </style>
