<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>出場選手一覧 | 競技会受付システム</title>
<link rel="icon" href="favicon.ico">
<style>
  :root{--primary:#123262;--bg:#f4f5f7;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#e0e2e7;
        --rule:#333;
        /* 種目（踊るダンス）に使う色。区分名の濃紺と見分けがつく落ち着いた赤。 */
        --accent:#a4262c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,-apple-system,"Segoe UI",sans-serif}
  header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center}
  header h1{font-size:16px;margin:0}
  /* どの大会を見ているのかは常に見えている必要があるので、受付システム本体と同じ場所に出す */
  header .comp{font-size:13px;opacity:.9}
  header a{color:#fff;font-size:13px;text-decoration:none;opacity:.85}
  nav.tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--border);
    padding:6px 8px 0;overflow-x:auto}
  nav.tabs a,nav.tabs span{flex:none;padding:10px 14px;color:var(--muted);font-weight:700;font-size:14px;
    border-bottom:3px solid transparent;text-decoration:none;white-space:nowrap}
  nav.tabs a:hover{color:var(--text)}
  nav.tabs .active{color:var(--primary);border-bottom-color:var(--primary)}
  /* 画面が広いと、上の帯とタブだけ左右の端まで広がって真ん中が空いてしまう。
     帯の色は端まで出したいので、中身のほうを余白で中ほどへ寄せる。 */
  header,nav.tabs{padding-left:max(16px,calc((100% - 1080px) / 2));
    padding-right:max(16px,calc((100% - 1080px) / 2))}
  main{max-width:960px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  button{font-size:15px;font-weight:700;padding:10px 16px;border:none;border-radius:8px;
    background:var(--primary);color:#fff;cursor:pointer}
  button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
  select{font-size:16px;padding:10px;border:1px solid var(--border);border-radius:8px;width:100%;background:#fff}
  label.lab{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .checkbox-row{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text)}

  /* ── 紙の見た目。画面でも刷り上がりに近い形で見せる ── */
  #paper{background:#fff;padding:14mm 12mm;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  /* 紙の文字と罫線の色。印刷したときの濃さや、区分の帯の色との相性で選べるようにする。
     区分名の帯・種目の枠はそれぞれ自分の色を持っているので、ここでは変わらない。 */
  #paper{--ink:#1a1a1a;color:var(--ink)}
  #paper table.pg th,#paper table.pg td{border-color:var(--ink)}
  /* 紙を縮小して見せるときの入れもの（縮小したぶんの余白を切り詰める） */
  #sheet{overflow:hidden}
  .sheet-head{font-size:13px;font-weight:700;margin:0 0 10px}
  .sheet-head .date{font-weight:400;color:var(--muted);margin-left:10px}

  /* 区分ごとのかたまり。プログラムの選手名簿と同じ、左右2段組。 */
  /* --xp は「下の余白をつめる」で足す行の高さ（上下それぞれのパディング）。
     ページごとに余り具合が違うので、JSが区分ごとに入れる。既定は足さない。 */
  .blk{margin-bottom:14px;--xp:0px}
  /* 区分名と種目の見出し。掲示やプログラムで選手・お客様が最初に見るところなので、
     区分名は濃紺の帯で大きく、種目は別の色の枠に入れて、ひと目で切り分かるようにする。 */
  /* 区分の系統ごとの色。帯の地色（--band）と左の罫・文字（--bar）を切り替える。
     選手もお客様も、色でどの系統の競技かをひと目で見分けられるようにする。 */
  .k-ten   {--band:#e4f5e9;--bar:#15803d}   /* 10ダンス系  … 淡い緑（あれば一番はじめ） */
  .k-latin {--band:#fce8ef;--bar:#be185d}   /* ラテン      … 淡いピンク */
  .k-std   {--band:#e7eefb;--bar:#1e3a8a}   /* スタンダード … 淡い青 */
  .k-senior{--band:#f1e8fb;--bar:#6d28d9}   /* シニア系    … 淡い紫（種目を問わない） */
  .k-junior{--band:#cddffb;--bar:#1d4ed8}   /* ジュニア系  … 少し濃いめの青 */
  .k-other {--band:#fdedd8;--bar:#c2650a}   /* その他      … 淡いオレンジ */
  .blk .ttl{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;
    margin:0 0 5px;padding:5px 10px;background:var(--band,#eaf0f8);
    border-left:6px solid var(--bar,var(--primary));
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .blk .ttl .nm{font-size:16px;font-weight:800;color:var(--bar,var(--primary));
    letter-spacing:.02em;line-height:1.3}
  /* 区分の並べ替え。押すとその場で並びが変わり、サーバーにも保存する。
     紙には出さない（no-print）。 */
  .blk .ttl .mv{display:inline-flex;gap:2px;margin-left:8px}
  .blk .ttl .mv button{font-size:12px;font-weight:700;line-height:1;padding:3px 7px;
    border:1px solid var(--bar,var(--primary));border-radius:5px;
    background:#fff;color:var(--bar,var(--primary));cursor:pointer}
  .blk .ttl .mv button:disabled{opacity:.3;cursor:not-allowed}
  .blk .ttl .dance{margin-left:auto;font-size:13px;font-weight:800;color:var(--accent);
    background:#fff;border:1.5px solid var(--accent);border-radius:4px;padding:1px 9px;white-space:nowrap;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .blk .ttl .dance .k{font-size:11px;margin-right:7px;font-weight:700}
  .blk .none{font-size:12px;color:var(--muted);padding:2px 0 6px}
  /* ── 区分の並べ替えの小窓 ──
     区分名だけを並べるので、19区分あっても1画面に収まる。
     ⇈⇊ でいちばん上・下へ、▲▼ でひとつずつ、パソコンでは ⋮⋮ をつかんで動かす。 */
  #so-back{position:fixed;inset:0;z-index:50;background:rgba(10,16,26,.5);
    display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
  #so-back.hidden{display:none}
  .so-box{width:100%;max-width:620px;background:#fff;border-radius:12px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .so-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--primary);color:#fff}
  .so-hd b{font-size:16px;white-space:nowrap}
  .so-hd .sub{font-size:12px;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .so-hd button{margin-left:auto;font:inherit;font-size:13px;font-weight:700;border:0;border-radius:8px;
    padding:6px 14px;background:#fff;color:var(--primary);cursor:pointer;flex:none}
  .so-list{list-style:none;margin:0;padding:6px 0;max-height:60vh;overflow:auto}
  .so-row{display:flex;align-items:center;gap:8px;padding:5px 14px;border-bottom:1px solid #eef0f4;
    font-size:14px;background:#fff}
  .so-row:last-child{border-bottom:0}
  .so-row.drag{opacity:.4}
  .so-row.over{box-shadow:inset 0 3px 0 var(--primary)}
  .so-row.over-b{box-shadow:inset 0 -3px 0 var(--primary)}
  .so-h{color:#b9bec7;cursor:grab;font-size:13px;letter-spacing:-2px;flex:none}
  .so-no{width:2em;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
  .so-cd{font-weight:800;color:var(--primary);width:4.2em;flex:none}
  .so-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .so-n{color:var(--muted);font-size:12px;width:3.4em;text-align:right;
    font-variant-numeric:tabular-nums;flex:none}
  .so-bt{display:inline-flex;gap:3px;flex:none}
  .so-bt button{font:inherit;font-size:13px;font-weight:700;line-height:1;padding:6px 8px;
    border:1px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);cursor:pointer}
  .so-bt button:disabled{opacity:.25;cursor:not-allowed}
  .so-ft{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--border);
    background:#fafbfd;flex-wrap:wrap}
  .so-ft .muted{font-size:12px}
  /* 狭い画面では、区分名とボタンを2行に分ける。1行に押し込むと区分名が
     「Ｊ…」まで削られ、どれを動かしているのか分からなくなるため。 */
  @media (max-width:560px){
    .so-hd .sub{display:none}
    .so-h{display:none}          /* 指で動かす端末ではドラッグは使わない */
    .so-row{flex-wrap:wrap;row-gap:6px;padding:8px 12px}
    .so-nm{flex:1 1 auto;font-size:14px}
    .so-n{width:auto}
    .so-bt{flex:1 1 100%;justify-content:flex-end;gap:6px}
    .so-bt button{padding:9px 15px;font-size:15px}   /* 指で押せる大きさにする */
  }
  table.pg{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
  /* 行の高さは line-height で決まる。日本語フォントの既定（normal）は 1.7 前後あり、
     それだけで1行 8mm 近くになってしまうので、紙でも画面でも詰めた値を明示する。 */
  table.pg th,table.pg td{border:1px solid var(--rule);padding:2px 4px;line-height:var(--pf-lh);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 見出しは列に入る言い方をJSが選ぶので、万一あふれても「…」は出さない */
  table.pg th{background:#f2f2f2;font-weight:600;text-align:center;font-size:11px;text-overflow:clip}
  /* 呼び出しにも照合にも使うので、背番号と氏名は大きく太く。
     どのセルも折り返さず、入りきらないものは shrinkCells() が字を縮めて全部見せる
     （Excelの「縮小して全体を表示する」と同じ。折り返すと行の高さがばらつき、
     紙とExcelで見え方も変わるため）。 */
  table.pg td.bib{text-align:center;font-weight:800;font-size:15px}
  table.pg td.nmc{font-weight:700;font-size:13.5px}
  /* 縮めて収める前提なので「…」は出さない（切れて見えると誰か分からなくなる） */
  table.pg td{text-overflow:clip}
  /* 記入欄は当日ペンで書き込む列。中身は空のままにする。 */
  table.pg td.memo{background:#fff}
  /* 左右の段のあいだ。罫線を引かない。 */
  table.pg th.gap,table.pg td.gap{border:none;background:transparent}
  /* 右の段が余ったところ。罫線を引かない。 */
  table.pg td.blank{border:none;background:transparent}

  .hidden{display:none !important}

  /* ── 紙のときの大きさ ──
     数値は変数にまとめ、--ps 倍して縮める（1 がそのままの大きさ）。
     --ps は「ページ数」の指定に合わせてJSが #paper に入れる。
     画面で刷り上がりの枚数を測るときは #paper に .pm を付けて紙と同じ大きさにする。
     紙のほうは JS を待たずに必ずこの大きさになるよう、@media print にも同じ指定を置く。 */
  :root{
    --ps:1;
    --pf-tbl:calc(9pt * var(--ps));    --pf-th:calc(7.5pt * var(--ps));
    --pf-bib:calc(13pt * var(--ps));   --pf-nm:calc(11pt * var(--ps));
    --pf-aff:calc(8.5pt * var(--ps));  --pf-head:calc(11pt * var(--ps));
    --pf-ttl:calc(12pt * var(--ps));   --pf-dan:calc(10pt * var(--ps));
    --pf-dk:calc(8.5pt * var(--ps));   --pf-pad:calc(1px * var(--ps));
    --pf-tpad:calc(2px * var(--ps));   --pf-gap:calc(3mm * var(--ps));
    /* 行の高さ。1.15 は日本語でも上下がぶつからない範囲でいちばん詰まる値。 */
    --pf-lh:1.15;
  }
  #paper.pm{width:190mm;padding:0;box-shadow:none}
  /* 掲示用。1段組・大きい字・1区分＝1ページ。離れて見る貼り紙や、
     進行席・審判席に配る紙のための出し方。紙の大きさの数値をまとめて置き換える。 */
  .poster{
    --pf-tbl:calc(11pt * var(--ps));   --pf-th:calc(9pt * var(--ps));
    --pf-bib:calc(14.5pt * var(--ps)); --pf-nm:calc(12pt * var(--ps));
    --pf-aff:calc(10pt * var(--ps));   --pf-head:calc(11pt * var(--ps));
    --pf-ttl:calc(14pt * var(--ps));   --pf-dan:calc(12pt * var(--ps));
    --pf-dk:calc(9.5pt * var(--ps));   --pf-pad:calc(2px * var(--ps));
    --pf-tpad:calc(5px * var(--ps));   --pf-gap:calc(6mm * var(--ps));
    /* 掲示用は離れて見る紙なので、行間は詰めない */
    --pf-lh:1.25;
  }
  /* 画面でも掲示用は大きく見せる。枚数を測っている間（.pm）と紙は上の変数を使うので、
     ここは画面だけに効かせる。 */
  @media screen{
    #paper.poster:not(.pm) table.pg{font-size:16px}
    #paper.poster:not(.pm) table.pg th{font-size:13px}
    #paper.poster:not(.pm) table.pg th,#paper.poster:not(.pm) table.pg td{padding:4px 8px}
    #paper.poster:not(.pm) table.pg td.bib{font-size:23px}
    #paper.poster:not(.pm) table.pg td.nmc{font-size:18px}
    #paper.poster:not(.pm) table.pg td.aff{font-size:15px}
    #paper.poster:not(.pm) .blk .ttl .nm{font-size:20px}
  }
  .pm table.pg{font-size:var(--pf-tbl)}
  .pm table.pg th{font-size:var(--pf-th)}
  .pm table.pg th,.pm table.pg td{padding:calc(var(--pf-pad) + var(--xp)) 2px}
  .pm table.pg td.bib{font-size:var(--pf-bib)}
  .pm table.pg td.nmc{font-size:var(--pf-nm)}
  .pm table.pg td.aff{font-size:var(--pf-aff)}
  .pm .sheet-head{font-size:var(--pf-head)}
  .pm .blk{margin-bottom:var(--pf-gap)}
  .pm .blk .ttl{padding:var(--pf-tpad) 8px;margin-bottom:var(--pf-tpad)}
  .pm .blk .ttl .nm{font-size:var(--pf-ttl)}
  .pm .blk .ttl .dance{font-size:var(--pf-dan);padding:0 7px}
  .pm .blk .ttl .dance .k{font-size:var(--pf-dk);margin-right:5px}

  @media print{
    @page{size:A4 portrait;margin:10mm}
    header,nav.tabs,.no-print{display:none !important}
    body{background:#fff}
    main{max-width:none;padding:0}
    /* 紙では用紙の幅いっぱいに使う（190mm の指定は画面で測るときだけのもの） */
    #paper,#paper.pm{padding:0;box-shadow:none;width:auto;transform:none !important}
    #sheet{overflow:visible;height:auto !important}
    table.pg{font-size:var(--pf-tbl)}
    /* 見出しは「記入欄」「背番号」が切れない大きさまで小さくする */
    table.pg th{font-size:var(--pf-th)}
    table.pg th,table.pg td{padding:calc(var(--pf-pad) + var(--xp)) 2px}
    table.pg td.bib{font-size:var(--pf-bib)}
    table.pg td.nmc{font-size:var(--pf-nm)}
    /* 所属は略称でも長いことがあるので、小さめにしたうえで折り返して全部出す */
    table.pg td.aff{font-size:var(--pf-aff)}
    .sheet-head{font-size:var(--pf-head)}
    .blk{margin-bottom:var(--pf-gap)}
    .blk .ttl{padding:var(--pf-tpad) 8px;margin-bottom:var(--pf-tpad)}
    .blk .ttl .nm{font-size:var(--pf-ttl)}
    .blk .ttl .dance{font-size:var(--pf-dan);padding:0 7px}
    .blk .ttl .dance .k{font-size:var(--pf-dk);margin-right:5px}
    /* 区分が紙の途中で切れないようにする（1区分が1ページに入りきらないときは分かれる） */
    .blk{break-inside:avoid;page-break-inside:avoid}
    /* 掲示用は1区分＝1ページ */
    .poster .blk + .blk{break-before:page;page-break-before:always}
    thead{display:table-header-group}
  }
</style>
</head>
<body>
<header>
  <h1>出場選手一覧</h1>
  <span class="comp" id="hd-comp"></span>
  <a href="uketsuke-manual.html" target="_blank" rel="noopener" style="margin-left:auto">マニュアル</a>
  <a href="uketsuke.html" style="margin-left:14px">← 受付システムへ戻る</a>
</header>

<nav class="tabs no-print">
  <a href="uketsuke.html#comp">大会</a>
  <a href="uketsuke.html#roster">締切時刻設定</a>
  <a href="uketsuke.html#checkin">受付</a>
  <a href="uketsuke.html#rollcall">欠場報告</a>
  <a href="uketsuke.html#manual">手動対応</a>
  <a id="nav-absent" href="uketsuke.html#rollcall">欠場者一覧</a>
  <span class="active">出場選手一覧</span>
</nav>

<main>
  <div class="card no-print">
    <label class="lab" for="pick">表示する区分</label>
    <select id="pick"></select>
    <div style="height:12px"></div>
    <div class="row">
      <button id="b-print">印刷する</button>
      <button id="b-xlsx" class="secondary">Excelで保存</button>
      <label class="checkbox-row"><span>ページ数</span>
        <input type="number" id="pages" min="1" max="40" step="1" placeholder="自動"
               style="width:72px;font-size:15px;padding:7px 8px;border:1px solid var(--border);border-radius:8px"></label>
      <button id="b-reload" class="secondary">最新にする</button>
      <button id="b-order" class="secondary">区分の並べ替え</button>
      <label class="checkbox-row"><input type="checkbox" id="c-poster"><span>掲示用（1段組・大きい字）</span></label>
      <label class="checkbox-row"><input type="checkbox" id="c-memo" checked><span>記入欄を付ける</span></label>
      <label class="checkbox-row"><input type="checkbox" id="c-empty"><span>エントリー0組の区分も出す</span></label>
      <label class="checkbox-row"><input type="checkbox" id="c-fill" checked><span>下の余白をつめる</span></label>
      <label class="checkbox-row"><span>文字と罫線</span>
        <select id="c-ink" style="width:auto;font-size:14px;padding:6px 8px"></select></label>
      <span class="muted" id="updated" style="margin-left:auto"></span>
    </div>
    <div class="muted" id="order-note" style="margin-top:8px"></div>
    <div class="muted" id="fit-note" style="margin-top:8px"></div>
    <div class="muted" id="syl-note" style="margin-top:6px"></div>
    <!-- 種目が出せないときだけ出す。JDSF（adm.jdsf.jp）へは押したときだけ取りに行く。 -->
    <button type="button" id="b-syl" class="secondary hidden"
            style="margin-top:8px;font-size:13px;padding:7px 12px">JDSFからシラバスを取り直す</button>
  </div>
  <!-- 区分の並べ替え。紙の上では区分の帯どうしが名簿の表を挟んで離れているので、
       区分名だけを並べた小窓で動かせるようにする（1画面で順番が見える）。 -->
  <div id="so-back" class="no-print hidden">
    <div class="so-box" role="dialog" aria-modal="true" aria-label="区分の並べ替え">
      <div class="so-hd">
        <b>区分の並べ替え</b>
        <span class="sub">紙・受付・欠場者一覧すべての並びが変わります</span>
        <button type="button" id="so-close">閉じる</button>
      </div>
      <ul class="so-list" id="so-list"></ul>
      <div class="so-ft">
        <button id="b-sort" class="secondary">系統順にそろえる</button>
        <span class="muted" id="so-hint"></span>
      </div>
    </div>
  </div>

  <div id="sheet"><div id="paper"></div></div>
</main>

<script>
'use strict';
var DATA = null;     /* 大会のデータ（区分・名簿） */
var SYL  = null;     /* シラバスの競技内容（区分ごとの種目）。取れないこともある */

function el(id){ return document.getElementById(id); }
function esc(s){ if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function qs(k){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : ''; }
/* 区分名が未設定（コードのまま）のとき「JAS JAS」と二重に出さない */
function evName(e){ var n = (e && e.name) ? String(e.name).trim() : '';
  return (!n || n === e.code) ? '' : n; }

/* 大会名の突き合わせ（全角と半角、注意書きの違いを吸収する）は、
   シラバスの控えを作るサーバー側（api/_uketsuke_syllabus.php）へ移した。 */
/* 区分の系統。色分けと並び順に使う。
   DCSの区分名には「シニアⅡ Ａ級戦 スタンダード」のように系統が入っているので、
   名前で見分ける（読み取れないときはコードも見る）。
   シニア・ジュニアは、スタンダードかラテンかを問わずその系統として扱う。 */
function evKind(e){
  var n = String((e && e.name) || '') + ' ' + String((e && e.code) || '');
  /* 10ダンスは、シニアやユースの名前が一緒に入っていても10ダンス系として扱う
     （例「全日本ユース１０ダンス選手権」「全日本シニアⅢ10ダンス選手権」）。 */
  if (/10ダンス|１０ダンス|10ﾀﾞﾝｽ|１０ﾀﾞﾝｽ|テンダンス|ﾃﾝﾀﾞﾝｽ/.test(n)) return 'ten';
  if (/シニア|ｼﾆｱ/.test(n))                       return 'senior';
  if (/ジュニア|ジュブナイル|ユース|キッズ|少年/.test(n)) return 'junior';
  if (/ラテン/.test(n))                            return 'latin';
  if (/スタンダード|モダン/.test(n))                 return 'std';
  return 'other';
}
/* 大会プログラムの並び。
   10ダンス系 → ラテン → スタンダード → シニア系 → ジュニア系 → その他。
   同じ系統の中は、DCSの並び（＝競技の順）をそのまま残す。 */
var KIND_ORDER = {ten: 0, latin: 1, std: 2, senior: 3, junior: 4, other: 5};
function sortEvents(list){
  return (list || []).map(function(e, i){ return {e: e, i: i}; })
    .sort(function(a, b){
      var d = KIND_ORDER[evKind(a.e)] - KIND_ORDER[evKind(b.e)];
      return d !== 0 ? d : a.i - b.i;
    })
    .map(function(x){ return x.e; });
}

/* シラバスの「W,T,(最終:V),F,Q」を、プログラムの書き方
   「W・T・V（最終予選より）・F・Q」に直す。
   「最終予選よりV」と前に置くと、どこまでがその断りなのか（V だけなのか
   V・F・Q までなのか）が読み取れない、という指摘があったため、
   種目を先に書いて、かっこをその直後に付ける。 */
function danceText(s){
  if (!s) return '';
  /* かっこの中のカンマでは切らない（(最終:V,F) のような書き方があるため） */
  var str = String(s), parts = [], buf = '', depth = 0, i, ch;
  for (i = 0; i < str.length; i++) {
    ch = str.charAt(i);
    if (ch === '(' || ch === '（') depth++;
    else if (ch === ')' || ch === '）') depth--;
    if (ch === ',' && depth <= 0) { parts.push(buf); buf = ''; continue; }
    buf += ch;
  }
  parts.push(buf);
  var items = parts.map(function(t){ return t.trim(); }).filter(function(t){ return t; });
  return items.map(function(t, i){
    var m = /^[(（]\s*最終\s*[:：]\s*(.+?)\s*[)）]$/.exec(t);
    if (!m) return t;
    var d = m[1].split(/[,、]/).map(function(x){ return x.trim(); })
             .filter(function(x){ return x; }).join('・');
    if (!d) return '';
    /* いちばんうしろに来るときは、かっこを付けると種目全部にかかって見えるので、
       前に置いて「最終予選よりＰ」と書く。途中のときは、どの種目に掛かるかが
       決まるように、その種目のうしろにかっこで付ける。 */
    return (i === items.length - 1) ? '最終予選より' + d : d + '（最終予選より）';
  }).filter(function(t){ return t; }).join('・');
}

var id = qs('id');
if (!id) {
  document.body.innerHTML = '<p style="padding:20px">大会が指定されていません。'
    + '<a href="uketsuke.html">受付システム</a>から開いてください。</p>';
} else {
  load();
}

function load(){
  return fetch('api/uketsuke_get.php?id=' + encodeURIComponent(id) + '&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      var first = (DATA === null);
      DATA = d;
      NEED = null;   /* 名簿が変わったら列幅を測り直す */
      el('hd-comp').textContent = d.name + (d.date ? '（' + d.date + '）' : '');
      el('nav-absent').href = 'uketsuke-absent.html?id=' + encodeURIComponent(id);
      if (first) buildPicker();
      el('updated').textContent = '最終更新 ' + new Date().toLocaleTimeString('ja-JP');
      return loadSyllabus();
    })
    .then(render)
    .catch(function(e){
      /* Forbidden は「別のタブ・別のアプリで開いてログインが引き継がれなかった」ことが多い。
         直し方が分かるように、理由と戻り先を出す。 */
      var m = /Forbidden/i.test(e.message)
        ? '<b>ログインが引き継がれませんでした。</b><br>'
          + 'スマートフォンでは、別のタブや別のアプリで開くとログインが切れることがあります。<br>'
          + '<a href="uketsuke.html">受付システムを開く</a>（ログインしてから、もう一度このページを開いてください）'
        : '読み込めませんでした（' + esc(e.message) + '）。'
          + '<a href="uketsuke.html">受付システム</a>でログインしてから開いてください。';
      document.body.innerHTML = '<p style="padding:20px;line-height:2">' + m + '</p>';
    });
}

/* 種目（ワルツ・タンゴなど）はDCSのファイルに入っていないので、シラバス（大会要項）から取る。
   サイトが毎朝取り込んでいる競技会一覧を使うので、JDSFのサイトへは見に行かない。
   公認番号は画面に返していないため、開催日と大会名で引き当てる。 */
function loadSyllabus(force){
  if (SYL !== null && !force) return Promise.resolve();
  /* 大会ごとの控え（data/uketsuke/<大会ID>/syllabus.json）を使う。
     控えが無ければサーバーが競技会一覧から作る。JDSFは大会が終わると
     シラバスを消すので、控えがあると後から何度でも印刷できる。 */
  return fetch('api/uketsuke_syllabus.php?id=' + encodeURIComponent(id) + '&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      SYL = {};
      CAN_REFRESH = !!d.can_refresh;
      var syl = d && d.syllabus;
      if (syl && (syl.events || []).length) {
        syl.events.forEach(function(e){ SYL[e.code] = e.dances || ''; });
        var n = Object.keys(SYL).filter(function(c){ return SYL[c]; }).length;
        var from = (syl.source === 'jdsf') ? 'JDSFのシラバスから直接' : 'シラバス（大会要項）から';
        el('syl-note').innerHTML = n
          ? '種目は' + from + '取りました'
            + (syl.syllabus_url ? '：<a href="' + esc(syl.syllabus_url)
               + '" target="_blank" rel="noopener">大会要項を見る</a>' : '')
          : 'シラバスは見つかりましたが、種目の記載を読み取れませんでした。';
      } else {
        /* 種目は無くても、シラバスの在りかが分かっていればリンクを出す
           （PDFのシラバスなど、自動で読めないものは目で確かめてもらう） */
        el('syl-note').innerHTML = 'この大会の種目はまだ取れていません。'
          + '（区分と名簿はそのまま使えます）'
          + (d.syllabus_url ? '　<a href="' + esc(d.syllabus_url)
             + '" target="_blank" rel="noopener">大会要項を見る</a>' : '');
      }
      syncSylButton();
    })
    .catch(function(){ SYL = {}; el('syl-note').textContent = ''; syncSylButton(); });
}

/* 種目が出せないときだけ、JDSFへ取りに行くボタンを出す。
   相手（adm.jdsf.jp）は連続アクセスで遮断されるので、押したときだけ1回。 */
var CAN_REFRESH = false;
function syncSylButton(){
  var b = el('b-syl');
  if (!b) return;
  var n = Object.keys(SYL || {}).filter(function(c){ return SYL[c]; }).length;
  b.classList.toggle('hidden', n > 0 || !CAN_REFRESH);
}
function refreshSyllabus(){
  var b = el('b-syl');
  b.disabled = true;
  b.textContent = 'JDSFに問い合わせています…';
  var fd = new FormData();
  fd.append('id', id);
  fd.append('action', 'refresh');
  fetch('api/uketsuke_syllabus.php', {method:'POST', body:fd, headers:{'X-CSRF-Token': (DATA && DATA.csrf) || ''}})
    .then(function(r){ return r.json(); })
    .then(function(d){
      b.disabled = false;
      b.textContent = 'JDSFからシラバスを取り直す';
      if (d && d.ok) { SYL = null; return loadSyllabus(true).then(render); }
      el('syl-note').innerHTML = esc((d && (d.message || d.error)) || '取りに行けませんでした。')
        + (d && d.syllabus_url ? '　<a href="' + esc(d.syllabus_url)
           + '" target="_blank" rel="noopener">大会要項を見る</a>' : '');
    })
    .catch(function(){
      b.disabled = false;
      b.textContent = 'JDSFからシラバスを取り直す';
      el('syl-note').textContent = '取りに行けませんでした（通信エラー）。';
    });
}

/* ── 紙の文字と罫線の色 ──
   既定の黒だと罫線が強く、区分の帯の色とも合わないことがあるので選べるようにする。
   印刷に耐える濃さのものだけを並べる（薄い色は紙に出ると読めなくなる）。
   選んだ色はこの端末に覚える（大会ごとではなく、刷る人の好みのため）。 */
var INK_KEY = 'uk_prog_ink';
var INKS = [
  ['#1a1a1a', '黒'],
  ['#123262', '濃紺'],
  ['#1e3a8a', '青'],
  ['#5b4636', 'こげ茶'],
  ['#4b5563', 'グレー']
];
function inkNow(){
  var v = '';
  try { v = localStorage.getItem(INK_KEY) || ''; } catch (e) {}
  for (var i = 0; i < INKS.length; i++) if (INKS[i][0] === v) return v;
  return INKS[0][0];
}
function applyInk(v){ el('paper').style.setProperty('--ink', v); }
function buildInkPicker(){
  var cur = inkNow();
  el('c-ink').innerHTML = INKS.map(function(k){
    return '<option value="' + esc(k[0]) + '"' + (k[0] === cur ? ' selected' : '') + '>'
      + esc(k[1]) + '</option>';
  }).join('');
  applyInk(cur);
  el('c-ink').addEventListener('change', function(){
    try { localStorage.setItem(INK_KEY, el('c-ink').value); } catch (e) {}
    applyInk(el('c-ink').value);
  });
}

/* 紙に出す順。区分マスタ（events.json）の並びをそのまま使う。
   系統順（10ダンス→ラテン→スタンダード→シニア→ジュニア）に戻したいときは
   「系統順にそろえる」で並び自体を書き換える。 */
function orderedEvents(){ return (DATA.events || []).slice(); }

function buildPicker(){
  el('pick').innerHTML = '<option value="">すべての区分</option>'
    + orderedEvents().map(function(e){
        var n = evName(e);
        return '<option value="' + esc(e.code) + '">' + esc(e.code) + (n ? '　' + esc(n) : '') + '</option>';
      }).join('');
  el('pick').addEventListener('change', render);
  el('c-poster').addEventListener('change', render);
  el('c-memo').addEventListener('change', render);
  el('c-empty').addEventListener('change', function(){ render(); renderSortList(); });
  el('c-fill').addEventListener('change', updateFit);
  el('b-reload').addEventListener('click', load);
  el('b-sort').addEventListener('click', function(){
    if (!DATA) return;
    if (!confirm('区分の並びを系統順（10ダンス→ラテン→スタンダード→シニア→ジュニア）に'
               + 'そろえます。\n受付タブや欠場者一覧の並びも変わります。よろしいですか？')) return;
    DATA.events = sortEvents(DATA.events);
    saveEventOrder();
  });
  el('b-syl').addEventListener('click', refreshSyllabus);
  /* 区分の並べ替えの小窓。開く・閉じる（外側を押す、Escでも閉じる） */
  el('b-order').addEventListener('click', openSort);
  el('so-close').addEventListener('click', closeSort);
  el('so-back').addEventListener('click', function(e){ if (e.target === el('so-back')) closeSort(); });
  document.addEventListener('keydown', function(e){
    if ((e.key === 'Escape' || e.keyCode === 27) && !el('so-back').classList.contains('hidden')) closeSort();
  });
  el('pages').addEventListener('input', updateFit);
  el('b-print').addEventListener('click', function(){
    updateFit();
    window.print();
  });
  el('b-xlsx').addEventListener('click', downloadXlsx);
  buildInkPicker();
}

/* いま紙に出している区分を、出している順に返す。draw() と同じ選び方。 */
function shownCodes(){
  var only = el('pick').value, withEmpty = el('c-empty').checked;
  return orderedEvents()
    .filter(function(e){ return !only || e.code === only; })
    .filter(function(e){ return withEmpty || entriesFor(e.code).length; })
    .map(function(e){ return e.code; });
}

/* 紙の体裁を測る。段数・列幅・行の高さ・文字の大きさを、
   紙と同じ大きさ（.pm）で組んだ実物から読む。同じ計算をExcel側にも書くと、
   片方だけ直したときに紙とExcelで体裁が食い違うため、測った値をそのまま渡す。 */
function printMetrics(){
  var paper = el('paper'), had = paper.classList.contains('pm');
  /* 画面用に縮小表示しているときは、そのままでは測れないので一旦もどす */
  var tf = paper.style.transform; paper.style.transform = '';
  paper.classList.add('pm');

  var PT   = 0.75;                       /* px → pt（CSSの決まりで 96dpi） */
  var cols = isPoster() ? 1 : COLS;
  var memo = el('c-memo').checked;
  var cw   = colWidths(memo, cols);
  function h(sel, def){
    var e = paper.querySelector(sel);
    return (e ? e.getBoundingClientRect().height : def) * PT;
  }
  function fs(sel, def){
    var e = paper.querySelector(sel);
    return e ? parseFloat(getComputedStyle(e).fontSize) * PT : def;
  }
  var blk = paper.querySelector('.blk');
  var m = {
    cols: cols,
    memo: memo ? 1 : 0,
    w:    cw.px,
    gap:  cw.gap / 100 * (190 * MM),
    rows: {
      data:   h('.blk tbody tr', 22),
      head:   h('.blk thead tr', 18),
      title:  h('.blk .ttl', 28),
      spacer: (blk ? (parseFloat(getComputedStyle(blk).marginBottom) || 0) : 11) * PT
    },
    fonts: {
      bib: fs('.blk td.bib', 13),      nm:  fs('.blk td.nmc', 11),
      aff: fs('.blk td.aff', 8.5),     th:  fs('.blk thead th', 7.5),
      ttl: fs('.blk .ttl .nm', 12),    dan: fs('.blk .ttl .dance', 10)
    },
    /* 紙で選んだ文字と罫線の色。Excelも同じ見た目にする */
    ink: inkNow(),
    kinds: {}
  };
  (DATA.events || []).forEach(function(e){ m.kinds[e.code] = evKind(e); });

  if (!had) paper.classList.remove('pm');
  paper.style.transform = tf;
  return m;
}

/* Excel（.xlsx）で保存する。1枚目は紙と同じ体裁（区分の帯・段組・同じ行の高さ）、
   2枚目は並べ替えや貼り付けに使える平らな表。
   並び順は画面と同じにしたいので、区分コードの並びもこちらから渡す。 */
function downloadXlsx(){
  if (!DATA) return;
  var codes = shownCodes();
  if (!codes.length) { alert('出す区分がありません。'); return; }
  location.href = 'api/uketsuke_program_xlsx.php?id=' + encodeURIComponent(id)
    + '&codes=' + encodeURIComponent(codes.join(','))
    + '&fmt=' + encodeURIComponent(JSON.stringify(printMetrics()));
}

/* その区分にエントリーしている組を背番号順に返す */
function entriesFor(code){
  return (DATA.roster || [])
    .filter(function(r){ return (r.events || []).indexOf(code) >= 0; })
    .sort(function(a, b){ return (Number(a.bib) || 0) - (Number(b.bib) || 0); });
}

/* 掲示用（1段組・大きい字）かどうか */
function isPoster(){ return el('c-poster').checked; }

/* 1組ぶんのセル。無い側は枠だけ残す。 */
function cells(r, memo){
  if (!r) {
    /* 右の段が余ったところは、枠を出さずに空けておく（元の様式に合わせる） */
    var n = memo ? 5 : 4, out = '';
    while (n--) out += '<td class="blank"></td>';
    return out;
  }
  var m = memo ? '<td class="memo"></td>' : '';
  return m
    + '<td class="bib">' + esc(r.bib) + '</td>'
    + '<td class="nmc">' + esc(r.leader) + '</td>'
    + '<td class="nmc">' + esc(r.partner) + '</td>'
    + '<td class="aff">' + esc(r.affiliation) + '</td>';
}

/* 見出しの言い方。列に入りきるものを左から順に選ぶ。
   幅の狭い列で「記入欄」「背番号」と書くと「記…」「背…」と切れて出てしまうため、
   切って出すのではなく、短い言い方に替える。 */
var HEAD_WORDS = [
  ['記入欄', '記入', '記', ''],           /* 記入欄（memo があるときだけ） */
  ['背番号', '番号', '№'],
  ['リーダー', 'ﾘｰﾀﾞｰ', 'L'],
  ['パートナー', 'ﾊﾟｰﾄﾅｰ', 'P'],
  ['所属', '所']
];
var HCTX = null;
/* 幅 wPx（px）に収まる言い方を返す。pt は見出しの文字の大きさ。 */
function fitWord(cands, wPx, pt){
  if (!HCTX) HCTX = document.createElement('canvas').getContext('2d');
  HCTX.font = '600 ' + (pt * PS).toFixed(2) + 'pt ' + getComputedStyle(document.body).fontFamily;
  for (var i = 0; i < cands.length; i++) {
    if (HCTX.measureText(cands[i]).width + 5 <= wPx) return cands[i];
  }
  return cands[cands.length - 1];
}
function headCells(memo, cw){
  var words = memo ? HEAD_WORDS : HEAD_WORDS.slice(1);
  return words.map(function(cands, i){
    return '<th>' + esc(cw ? fitWord(cands, cw.px[i], cw.th) : cands[0]) + '</th>';
  }).join('');
}

/* ── 列幅 ──
   氏名も所属も、幅が足りないと2行になり、そのぶん行が高くなって枚数が増える。
   名前やクラブ名の長さは大会ごとに違うので、実際の文字の幅を測ってから割り振る。
   （固定の割合だと「京都Ｄアスリートクラブ」のような所属でほぼ全行が2行になっていた） */
var MEMO_MM = 7;      /* 記入欄。丸やレ点を書ける最小の幅 */
var NEED = null;      /* 測った必要幅（px。--ps が 1 のときの大きさ） */

function nth(arr, q){
  if (!arr.length) return 0;
  arr.sort(function(a, b){ return a - b; });
  return arr[Math.min(arr.length - 1, Math.floor(arr.length * q))];
}
/* 氏名は上位5%、所属は上位10%だけ縮めて入れてよい、という割り切りで幅を決める。
   いちばん長い1件に合わせると、そのために全体が小さくなってしまうため。
   入りきらない分は shrinkCells() が字を縮めて全部見せる。 */
function measureNeeds(){
  var fam = getComputedStyle(document.body).fontFamily;
  var ctx = document.createElement('canvas').getContext('2d');
  function w(font, s){ ctx.font = font; return ctx.measureText(String(s == null ? '' : s)).width; }
  var names = [], affs = [], bibs = [0];
  (DATA.roster || []).forEach(function(r){
    names.push(w('700 11pt ' + fam, r.leader));
    names.push(w('700 11pt ' + fam, r.partner));
    affs.push(w('8.5pt ' + fam, r.affiliation));
    bibs.push(w('800 13pt ' + fam, r.bib));
  });
  NEED = {bib: Math.max.apply(null, bibs), name: nth(names, 0.95), aff: nth(affs, 0.90)};
}

/* 1組ぶんの列幅。%（表に対する割合）と、実際の幅（px）の両方を返す。
   実寸は見出しの言い方を選ぶのに使う。
   文字は --ps で縮むが、枠線と左右の余白は縮まない。縮めたときに背番号が
   「1…」と切れたことがあるので、いまの縮尺での必要幅で割り振る。 */
function colWidths(memo, cols){
  /* 掲示用は1段組・決め打ちの割合 */
  if (isPoster()) {
    var pw = memo ? [8, 8, 26, 26, 32] : [9, 28, 28, 35];
    return {gap: 0, pct: pw, th: 9,
            px: pw.map(function(p){ return p / 100 * (190 * MM); })};
  }
  if (!NEED) measureNeeds();
  var gap  = cols > 2 ? 2 : 3;                   /* 段のあいだ（%） */
  var sect = (100 - gap * (cols - 1)) / cols;    /* 1段ぶんの幅（%） */
  var FIX  = 6;                                  /* 枠線と左右の余白（px。縮まない） */
  var need = [];
  /* 記入欄は手で書き込む列なので、縮めすぎない */
  if (memo) need.push(Math.max(5, MEMO_MM * PS) * 96 / 25.4);
  /* 背番号は切れると呼び出しに使えないので、1割の余裕を持たせる */
  need.push(NEED.bib * PS * 1.1, NEED.name * PS, NEED.name * PS, NEED.aff * PS);
  need = need.map(function(x){ return x + FIX; });
  var sum = need.reduce(function(a, b){ return a + b; }, 0);
  var pct = need.map(function(x){ return sect * x / sum; });
  /* 見出しの言い方は紙での幅で決める（画面の幅で決めると、
     掲示用と行き来したときに言い方が入れ替わってしまう） */
  var tw = 190 * MM;
  return {gap: gap, pct: pct, th: 7.5, px: pct.map(function(p){ return p / 100 * tw; })};
}

/* 列幅（合計 100%）。cols は段組の数。 */
function colGroup(memo, cols, cw){
  var one = cw.pct.map(function(x){ return '<col style="width:' + x.toFixed(3) + '%">'; }).join('');
  var out = '';
  for (var i = 0; i < cols; i++) out += (i ? '<col style="width:' + cw.gap + '%">' : '') + one;
  return '<colgroup>' + out + '</colgroup>';
}

/* ── 何ページに収めるか ──
   指定がなければ2段組・そのままの大きさで刷る。ページ数を入れたら、
   「段組を増やす」→「全体を縮める」の順で、その枚数に収める。
   段組を増やしても字の大きさは変わらない（横幅だけ狭くなる）ので、
   字を小さくするより先に段組で詰めたほうが読みやすい紙になる。 */
var MM = 96 / 25.4;                 /* 1mm ぶんのピクセル数（CSSの決まりで 96dpi） */
var PAGE_H = 277 * MM;              /* A4縦 297mm から上下の余白 10mm ずつを引いた高さ */
var MIN_PS = 0.5;                   /* これ以上は小さくしない */
var MAX_PS = 2.0;                   /* これ以上は大きくしない */

/* いまの大きさで何ページになるかを数える。
   区分は途中で切らない指定なので、入りきらなければ次のページへ送る。 */
function measurePages(){
  var paper = el('paper'), had = paper.classList.contains('pm');
  /* 画面用に縮小表示しているときは、そのままでは測れないので一旦もどす */
  var tf = paper.style.transform; paper.style.transform = '';
  var pages = countPages(paper, had);
  paper.style.transform = tf;
  return pages;
}
function countPages(paper, had){
  paper.classList.add('pm');
  var blksAll = paper.querySelectorAll('.blk');
  /* 掲示用は1区分＝1ページ。入りきらない区分だけ枚数が増える。 */
  if (paper.classList.contains('poster')) {
    var t = 0;
    for (var k = 0; k < blksAll.length; k++) {
      t += Math.max(1, Math.ceil(blksAll[k].getBoundingClientRect().height / PAGE_H));
    }
    if (!had) paper.classList.remove('pm');
    return t || 1;
  }
  var pages = 1, y = 0;
  var head = paper.querySelector('.sheet-head');
  if (head) y = head.getBoundingClientRect().height
               + (parseFloat(getComputedStyle(head).marginBottom) || 0);
  var blks = paper.querySelectorAll('.blk');
  for (var i = 0; i < blks.length; i++) {
    var h = blks[i].getBoundingClientRect().height
          + (parseFloat(getComputedStyle(blks[i]).marginBottom) || 0);
    if (h > PAGE_H) {                       /* 1枚に入りきらない区分 */
      if (y > 0) { pages++; y = 0; }
      var n = Math.ceil(h / PAGE_H);
      pages += n - 1;
      y = h - (n - 1) * PAGE_H;
      continue;
    }
    if (y + h > PAGE_H) { pages++; y = 0; }
    y += h;
  }
  if (!had) paper.classList.remove('pm');
  return pages;
}

/* ── 下の余白をつめる ──
   区分は紙の途中で切らないので、ページの終わりが大きく余ることがある（最後の1枚は特に）。
   余ったぶんを、そのページに載っている行へ均等に配って行を高くする。
   足すのは行の高さの3割5分までで、余りが大きいページでも間延びさせない。 */
var FILL_MIN  = 12 * MM;   /* これ未満の余りは触らない */
var FILL_KEEP =  3 * MM;   /* 足しすぎてページが増えないよう、これだけは残す */
var FILL_MAX  = 0.35;      /* 1行に足せるのは、その行の高さのこの割合まで。
                              1区分だけ刷るときのように余りが大きいページで、
                              行だけが間延びした紙にならないようにする。 */

/* 紙1枚ぶんずつ、載っている区分と使った高さを返す。数え方は countPages と同じ。
   1枚に入りきらない区分がまたいでいるページは over を立てて、つめる対象から外す。 */
function pageGroups(paper){
  var pages = [], cur = {blks: [], used: 0, over: false};
  var head = paper.querySelector('.sheet-head');
  if (head) cur.used = head.getBoundingClientRect().height
                     + (parseFloat(getComputedStyle(head).marginBottom) || 0);
  var blks = paper.querySelectorAll('.blk');
  for (var i = 0; i < blks.length; i++) {
    var b = blks[i];
    var h = b.getBoundingClientRect().height
          + (parseFloat(getComputedStyle(b).marginBottom) || 0);
    if (h > PAGE_H) {
      if (cur.used > 0) { pages.push(cur); }
      var n = Math.ceil(h / PAGE_H);
      for (var k = 0; k < n - 1; k++) pages.push({blks: [b], used: PAGE_H, over: true});
      cur = {blks: [b], used: h - (n - 1) * PAGE_H, over: true};
      continue;
    }
    if (cur.used + h > PAGE_H) { pages.push(cur); cur = {blks: [], used: 0, over: false}; }
    cur.blks.push(b);
    cur.used += h;
  }
  pages.push(cur);
  return pages;
}

function clearFill(paper){
  paper.querySelectorAll('.blk').forEach(function(b){ b.style.removeProperty('--xp'); });
}

function fillBottom(){
  var paper = el('paper'), had = paper.classList.contains('pm');
  /* 画面用に縮小表示しているときは、そのままでは測れないので一旦もどす */
  var tf = paper.style.transform; paper.style.transform = '';
  paper.classList.add('pm');
  clearFill(paper);
  if (el('c-fill').checked && !isPoster()) {
    var before = pageGroups(paper);
    before.forEach(function(p){
      if (p.over || !p.blks.length) return;
      var room = PAGE_H - p.used - FILL_KEEP;
      if (room < FILL_MIN) return;
      var trs = [];
      p.blks.forEach(function(b){
        b.querySelectorAll('tr').forEach(function(tr){ trs.push(tr); });
      });
      if (!trs.length) return;
      var nat = trs.reduce(function(a, tr){ return a + tr.getBoundingClientRect().height; }, 0) / trs.length;
      var add = Math.min(room / trs.length, nat * FILL_MAX);
      if (add < 0.5) return;
      /* padding は上下に付くので、1行ぶんの半分ずつ入れる */
      p.blks.forEach(function(b){ b.style.setProperty('--xp', (add / 2).toFixed(2) + 'px'); });
    });
    /* 足したせいで枚数が増えていないか確かめる。増えていたら何もしなかったことにする。 */
    if (pageGroups(paper).length !== before.length) clearFill(paper);
  }
  if (!had) paper.classList.remove('pm');
  paper.style.transform = tf;
}

/* ── 縮小して全体を表示する ──
   セルは折り返さない。列に入りきらないものだけ、入る大きさまで字を縮めて全部見せる
   （Excelの「縮小して全体を表示する」と同じ）。折り返すと行の高さがばらつき、
   そのぶん枚数が増えるうえ、Excelに出したときと見え方が変わってしまう。

   幅は文字の実測（canvas）で見る。1セットずつ clientWidth を読むと組み直しが
   何十回も起きて重いので、列の幅は種類ごとに1回だけ測る（同じ列の幅は全段で同じ）。 */
function shrinkCells(){
  var paper = el('paper'), had = paper.classList.contains('pm');
  /* 紙の列幅で決める。画面用に縮小表示しているときは、そのままでは測れないので一旦もどす */
  var tf = paper.style.transform; paper.style.transform = '';
  paper.classList.add('pm');

  var fam = getComputedStyle(document.body).fontFamily;
  if (!HCTX) HCTX = document.createElement('canvas').getContext('2d');

  ['bib', 'nmc', 'aff'].forEach(function(cls){
    var list = paper.querySelectorAll('table.pg td.' + cls);
    if (!list.length) return;
    list.forEach(function(td){ td.style.fontSize = ''; });      /* 前回の縮小を戻す */

    var st    = getComputedStyle(list[0]);
    var base  = parseFloat(st.fontSize);
    var avail = list[0].clientWidth
              - (parseFloat(st.paddingLeft) || 0) - (parseFloat(st.paddingRight) || 0);
    if (!(base > 0) || !(avail > 0)) return;
    HCTX.font = st.fontWeight + ' ' + base + 'px ' + fam;

    list.forEach(function(td){
      var t = td.textContent;
      if (!t) return;
      var w = HCTX.measureText(t).width;
      /* 1%ぶん余裕を持たせる。ぴったりに縮めると、実際の字送りとの
         わずかな差で最後の1文字が欠けることがある。 */
      if (w > avail) td.style.fontSize = (base * avail / w * 0.99).toFixed(2) + 'px';
    });
  });

  if (!had) paper.classList.remove('pm');
  paper.style.transform = tf;
}

/* --pf-* は :root で組み立てているので、--ps も :root に入れないと効かない
   （変数の計算は、使う場所ではなく書いてある場所で行われるため）。
   列幅の計算にも使うので、同じ値を PS に控えておく。 */
var PS = 1;
function setPs(v){ PS = v; document.documentElement.style.setProperty('--ps', v); }

/* 段数を決め打ちにして、指定ページ数に収まるいちばん大きい縮尺を探す。
   列幅は縮尺によって変わるので、試すたびに組み直す。 */
function fitScale(target){
  function pagesAt(v){ setPs(v); draw(); return measurePages(); }
  if (pagesAt(1) <= target) return {scale: 1, pages: measurePages()};
  var lo = MIN_PS, hi = 1, best = null;
  for (var i = 0; i < 10; i++) {
    var mid = (lo + hi) / 2;
    if (pagesAt(mid) <= target) { best = mid; lo = mid; } else { hi = mid; }
  }
  if (best === null) return {scale: MIN_PS, pages: pagesAt(MIN_PS), over: true};
  return {scale: best, pages: pagesAt(best)};
}

/* そのままの大きさで指定より少ない枚数に収まるときは、指定の枚数まで「広げる」。
   広げ方は縮めるときの逆で、まず段組を減らす。

   2段組のまま字だけ大きくしてはいけない。列の幅は紙の幅で決まっていて変わらないので、
   入りきらなくなった氏名や所属が「縮小して全体を表示」で小さく戻され、枚数だけ増えて
   字はほとんど大きくならない（実測：2段組で文字150%にしても、氏名の実際の大きさは
   100%のときとほぼ同じだった）。1段組なら1組が紙の幅いっぱいを使えるので本当に大きくなる。

   1段組でちょうどよい枚数にするために、文字を少し小さくすることはある。
   区分が多い大会では 1段組・そのままの大きさ にすると指定を大きく超えてしまい、
   それを断ると「指定しても何も変わらない」ことになるため（19区分の大会で
   1段組100%＝6ページ。5ページの指定に対して、90%なら ちょうど5ページに収まる）。
   ただし小さくしすぎては本末転倒なので 80% までとする。 */
var EXPAND_MIN_PS = 0.8;

function expandLayout(target, basePages){
  function pagesAt(cols, v){ COLS = cols; setPs(v); draw(); return measurePages(); }
  /* いちばん小さくしても超えるなら、1段組にはできない */
  if (pagesAt(1, EXPAND_MIN_PS) > target) return {cols: 2, scale: 1, kept: true};
  var best;
  if (pagesAt(1, MAX_PS) <= target) {
    best = MAX_PS;
  } else {
    var lo = EXPAND_MIN_PS, hi = MAX_PS;
    best = EXPAND_MIN_PS;
    for (var i = 0; i < 10; i++) {
      var mid = (lo + hi) / 2;
      if (pagesAt(1, mid) <= target) { best = mid; lo = mid; } else { hi = mid; }
    }
  }
  /* 1段組にしても枚数が増えないなら、いまの2段組のほうが字は大きい */
  var p = pagesAt(1, best);
  if (p <= basePages) return {cols: 2, scale: 1, kept: true};
  return {cols: 1, scale: best, pages: p, maxed: best >= MAX_PS};
}

var COLS    = 2;            /* いま組んでいる段数 */
var COL_TRY = [2, 3, 4];    /* 試す段数 */

/* 段数と縮尺の組み合わせのうち、いちばん字が大きくなるものを選ぶ */
function fitLayout(target){
  if (!target) { COLS = 2; setPs(1); draw(); return {cols: COLS, scale: 1, pages: measurePages()}; }

  /* まず、そのままの大きさ（2段組）で何ページになるかを見る。
     指定がそれ以上なら、縮める話ではなく広げる話になる。 */
  COLS = 2; setPs(1); draw();
  var basePages = measurePages();
  if (basePages <= target) {
    var g = expandLayout(target, basePages);
    COLS = g.cols; setPs(g.scale); draw();
    return {cols: g.cols, scale: g.scale, pages: measurePages(),
            grew: !g.kept, maxed: !!g.maxed, kept: !!g.kept};
  }

  var best = null;
  COL_TRY.forEach(function(c){
    COLS = c;
    var r = fitScale(target);
    r.cols = c; r.over = !!r.over;
    var better;
    if (!best)                       better = true;
    else if (best.over && r.over)    better = r.pages < best.pages;   /* どちらも収まらないなら枚数が少ないほう */
    else if (best.over !== r.over)   better = best.over;              /* 収まるほうを採る */
    /* 段を増やすと1組あたりの横幅は狭くなるので、字が1割以上大きくなるときだけ乗り換える */
    else                             better = r.scale > best.scale * 1.1;
    if (better) best = r;
  });
  COLS = best.cols; setPs(best.scale); draw();
  best.pages = measurePages();
  return best;
}

function updateFit(){
  if (!DATA) return;
  /* 掲示用は1区分＝1ページなので、ページ数の指定は使わない */
  if (isPoster()) {
    COLS = 1; setPs(1);
    el('pages').disabled = true;
    el('fit-note').textContent = '掲示用は1区分＝1ページです（全部で ' + measurePages() + 'ページ）。';
    shrinkCells();
    showAsPaper(false);
    return;
  }
  el('pages').disabled = false;
  var t = parseInt(el('pages').value, 10);
  if (!(t > 0)) t = 0;
  var r = fitLayout(t);
  /* 枚数が決まってから、ページごとの余りを行の高さに配る（枚数は変えない） */
  fillBottom();
  /* 列に入りきらないセルの字を、入る大きさまで縮める（行の高さは変わらない） */
  shrinkCells();
  var pct = Math.round(r.scale * 100);
  /* 段組や文字を変えたとき、また画面が紙より狭いときは、刷り上がりそのものを出す。
     （狭い画面で紙と違う組み方をすると、背番号が「1…」と切れて見えてしまう） */
  showAsPaper(r.cols !== 2 || r.scale !== 1 || el('sheet').clientWidth < 190 * MM);
  if (!t) {
    el('pages').placeholder = String(r.pages);
    el('fit-note').textContent = 'このままの大きさ（2段組）で ' + r.pages + 'ページです。'
      + '枚数を変えたいときは「ページ数」に入れてください'
      + '（減らすときはまず段組を増やし、それでも入らないときだけ文字を縮めます。'
      + '増やすときは段組を減らし、それでも足りなければ文字を大きくします）。';
  } else if (r.over) {
    el('fit-note').textContent = t + 'ページには収まりませんでした。'
      + r.cols + '段組・いちばん小さい大きさ（文字 ' + pct + '%）で ' + r.pages + 'ページです。';
  } else if (r.kept) {
    /* 1段組にすると指定を超える（または文字を小さくしすぎる）ので、そのままで出す。
       指定がちょうど今の枚数のときは、広げる必要がないだけなので言い方を分ける。 */
    el('fit-note').textContent = (r.pages === t)
      ? t + 'ページです（2段組・文字はそのままの大きさ）。'
      : t + 'ページには広げられませんでした'
        + '（1段組にすると ' + t + 'ページを超えるか、文字が小さくなりすぎます）。'
        + 'このままの大きさ（2段組）で ' + r.pages + 'ページです。';
  } else if (r.grew) {
    /* 指定が今の枚数より多いので、段組を減らして広げた（縮尺で枚数を合わせる） */
    el('fit-note').textContent = r.pages + 'ページに広げます（' + r.cols + '段組'
      + (pct !== 100 ? '・文字と行間は ' + pct + '%' : '・文字はそのままの大きさ') + '）。'
      + (r.pages < t ? 'これ以上は大きくできないので ' + t + 'ページには届きません。' : '');
  } else {
    el('fit-note').textContent = t + 'ページに収めます（' + r.cols + '段組'
      + (pct < 100 ? '・文字と行間は ' + pct + '%' : '・文字はそのままの大きさ') + '）。';
  }
}

/* ── 画面の「紙」の見せ方 ──
   段組を増やしたり文字を縮めたりしたときは、画面の見た目と刷り上がりが食い違うと
   本当に収まったのかを確かめられない。そこで紙と同じ大きさ（.pm）で組み、
   画面に入りきらない分だけ全体を縮小して、刷り上がりそのものを見せる。 */
function showAsPaper(on){
  var p = el('paper'), s = el('sheet');
  p.style.transform = ''; s.style.height = '';
  if (!on) { p.classList.remove('pm'); return; }
  p.classList.add('pm');
  var k = Math.min(1, s.clientWidth / p.offsetWidth);
  if (k < 1) {
    p.style.transformOrigin = 'top left';
    p.style.transform = 'scale(' + k.toFixed(4) + ')';
    s.style.height = Math.ceil(p.offsetHeight * k) + 'px';
  }
}
/* 窓の幅が変わったら、縮小率を取り直す */
window.addEventListener('resize', function(){
  if (el('paper').classList.contains('pm')) showAsPaper(true);
});

/* 組み直してから、収まり具合を測り直す */
function render(){ draw(); updateFit(); bindMove(); }

/* ── 区分の並べ替え ──
   紙に出す順は区分マスタ（events.json）の並びそのもの。▲▼ でその並びを入れ替えて
   サーバーに保存するので、受付タブの区分ボタン・欠場者一覧・受付締切処理も同じ並びになる。
   エントリー0組の区分を隠しているときは、隠れている区分をまたいで動かす必要があるので、
   「画面で隣に見えている区分」の位置まで動かす。 */
function indexOfCode(list, code){
  for (var i = 0; i < list.length; i++) if (list[i].code === code) return i;
  return -1;
}
function moveEvent(code, dir){
  var all   = DATA.events || [];
  var shown = shownCodes();
  var si    = shown.indexOf(code);
  var nb    = shown[si + dir];
  var from  = indexOfCode(all, code);
  if (si < 0 || nb === undefined || from < 0) return;
  var item = all.splice(from, 1)[0];
  var to   = indexOfCode(all, nb);
  all.splice(dir < 0 ? to : to + 1, 0, item);
  saveEventOrder();
}
/* 区分マスタをまるごと保存し直す（並び順がそのまま記録される） */
function saveEventOrder(){
  render();                       /* 先に画面へ反映して、押した手応えを出す */
  renderSortList();               /* 小窓を開いているときは、その一覧も合わせる */
  setMoveBusy(true);               /* render が結び付け直すので、そのあとで止める */
  var fd = new FormData();
  fd.append('id', id);
  fd.append('events', JSON.stringify(DATA.events || []));
  fetch('api/uketsuke_save_events.php', {method:'POST', body:fd,
        headers:{'X-CSRF-Token': (DATA && DATA.csrf) || ''}})
    .then(function(r){ return r.json().catch(function(){ return {error:'通信エラー'}; }); })
    .then(function(j){
      if (j && j.error) throw new Error(j.message || j.error);
      el('order-note').textContent = '区分の並びを保存しました（' + new Date().toLocaleTimeString('ja-JP') + '）';
      setMoveBusy(false);
    })
    .catch(function(e){
      el('order-note').textContent = '';
      alert('区分の並びを保存できませんでした（' + e.message + '）。\n'
          + '「最新にする」で読み直してください。');
      setMoveBusy(false);
    });
}
function setMoveBusy(on){
  document.querySelectorAll('[data-mv],[data-so]').forEach(function(b){ b.disabled = on; });
  el('b-sort').disabled = on;
  if (!on) { syncMoveEnds(); renderSortList(); }
}
/* いちばん上の▲といちばん下の▼は押せないようにする */
function syncMoveEnds(){
  var shown = shownCodes();
  document.querySelectorAll('[data-mv]').forEach(function(b){
    var i = shown.indexOf(b.dataset.code);
    b.disabled = (b.dataset.mv === 'up') ? (i <= 0) : (i < 0 || i >= shown.length - 1);
  });
}
function bindMove(){
  document.querySelectorAll('[data-mv]').forEach(function(b){
    b.addEventListener('click', function(){
      moveEvent(b.dataset.code, b.dataset.mv === 'up' ? -1 : 1);
    });
  });
  syncMoveEnds();
}

/* ── 区分の並べ替えの小窓 ──
   紙の上では区分の帯が名簿の表を挟んで離れているので、▲を押すたびに
   どこへ行ったか分からなくなる。区分名だけの一覧を出して、順番が見えたまま
   動かせるようにする。動かすたびに紙へ反映して保存するのは▲▼と同じ。 */
function sortList(){
  /* 「表示する区分」で1区分だけ選んでいても、並べ替えは全体に対して行う。
     エントリー0組の区分は、紙に出しているときだけ並べる。 */
  var withEmpty = el('c-empty').checked;
  return orderedEvents().filter(function(e){ return withEmpty || entriesFor(e.code).length; });
}
function renderSortList(){
  var box = el('so-list');
  if (!box || el('so-back').classList.contains('hidden')) return;
  var list = sortList();
  box.innerHTML = list.map(function(e, i){
    var first = (i === 0), last = (i === list.length - 1);
    var n = entriesFor(e.code).length;
    return '<li class="so-row" draggable="true" data-code="' + esc(e.code) + '">'
      + '<span class="so-h" title="つかんで動かす">⋮⋮</span>'
      + '<span class="so-no">' + (i + 1) + '</span>'
      + '<span class="so-cd">' + esc(e.code) + '</span>'
      + '<span class="so-nm">' + esc(evName(e) || e.code) + '</span>'
      + '<span class="so-n">' + n + '組</span>'
      + '<span class="so-bt">'
      + '<button type="button" data-so="top"    data-code="' + esc(e.code) + '" title="いちばん上へ"'
        + (first ? ' disabled' : '') + '>⇈</button>'
      + '<button type="button" data-so="up"     data-code="' + esc(e.code) + '" title="ひとつ上へ"'
        + (first ? ' disabled' : '') + '>▲</button>'
      + '<button type="button" data-so="down"   data-code="' + esc(e.code) + '" title="ひとつ下へ"'
        + (last ? ' disabled' : '') + '>▼</button>'
      + '<button type="button" data-so="bottom" data-code="' + esc(e.code) + '" title="いちばん下へ"'
        + (last ? ' disabled' : '') + '>⇊</button>'
      + '</span></li>';
  }).join('');
  box.querySelectorAll('[data-so]').forEach(function(b){
    b.addEventListener('click', function(){ moveEventTo(b.dataset.code, b.dataset.so); });
  });
  bindSortDrag();
  el('so-hint').textContent = list.length + '区分　⇈⇊＝いちばん上／下へ'
    + (isTouch() ? '' : '　⋮⋮ をつかんで動かすこともできます');
}
function isTouch(){
  try { return !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches); }
  catch (e) { return false; }
}
/* 区分マスタ（DATA.events）の中で動かす。隠している区分をまたぐことがあるので、
   位置は「一覧で隣に見えている区分」を目印に決める（▲▼と同じ考え方）。 */
function moveEventTo(code, where){
  var all = DATA.events || [], list = sortList();
  var li = -1, i;
  for (i = 0; i < list.length; i++) if (list[i].code === code) li = i;
  var from = indexOfCode(all, code);
  if (li < 0 || from < 0 || list.length < 2) return;
  var item, to;
  if (where === 'top') {
    if (li === 0) return;
    item = all.splice(from, 1)[0];
    all.splice(indexOfCode(all, list[0].code), 0, item);
  } else if (where === 'bottom') {
    if (li === list.length - 1) return;
    item = all.splice(from, 1)[0];
    all.splice(indexOfCode(all, list[list.length - 1].code) + 1, 0, item);
  } else {
    var dir = (where === 'up') ? -1 : 1;
    var nb = list[li + dir];
    if (!nb) return;
    item = all.splice(from, 1)[0];
    to = indexOfCode(all, nb.code);
    all.splice(dir < 0 ? to : to + 1, 0, item);
  }
  saveEventOrder();
}
/* つかんだ区分を、落とした先の区分の前／後ろへ入れる */
function moveEventNear(code, targetCode, after){
  var all = DATA.events || [];
  if (code === targetCode) return;
  var from = indexOfCode(all, code);
  if (from < 0 || indexOfCode(all, targetCode) < 0) return;
  var item = all.splice(from, 1)[0];
  var to = indexOfCode(all, targetCode);
  all.splice(after ? to + 1 : to, 0, item);
  saveEventOrder();
}
var SO_DRAG = null;
function bindSortDrag(){
  if (isTouch()) return;          /* 指で操作する端末は、スクロールと衝突するので使わない */
  el('so-list').querySelectorAll('.so-row').forEach(function(row){
    row.addEventListener('dragstart', function(e){
      SO_DRAG = row.dataset.code;
      row.classList.add('drag');
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', SO_DRAG); } catch (x) {}
    });
    row.addEventListener('dragend', function(){
      SO_DRAG = null;
      el('so-list').querySelectorAll('.so-row').forEach(function(r){
        r.classList.remove('drag', 'over', 'over-b');
      });
    });
    row.addEventListener('dragover', function(e){
      if (!SO_DRAG || row.dataset.code === SO_DRAG) return;
      e.preventDefault();
      var r = row.getBoundingClientRect();
      var after = (e.clientY - r.top) > r.height / 2;
      row.classList.toggle('over', !after);
      row.classList.toggle('over-b', after);
    });
    row.addEventListener('dragleave', function(){ row.classList.remove('over', 'over-b'); });
    row.addEventListener('drop', function(e){
      if (!SO_DRAG || row.dataset.code === SO_DRAG) return;
      e.preventDefault();
      var r = row.getBoundingClientRect();
      moveEventNear(SO_DRAG, row.dataset.code, (e.clientY - r.top) > r.height / 2);
      SO_DRAG = null;
    });
  });
}
function openSort(){
  if (!DATA) return;
  el('so-back').classList.remove('hidden');
  renderSortList();
}
function closeSort(){ el('so-back').classList.add('hidden'); }

/* 紙の中身を組む（枚数の計算はしない） */
function draw(){
  var only  = el('pick').value;
  var memo  = el('c-memo').checked;
  el('paper').classList.toggle('poster', isPoster());
  var withEmpty = el('c-empty').checked;
  var evs   = orderedEvents().filter(function(e){ return !only || e.code === only; });

  var html = '<div class="sheet-head">' + esc(DATA.name)
    + (DATA.date ? '<span class="date">' + esc(DATA.date) + '</span>' : '') + '</div>';

  html += evs.map(function(e){
    var list = entriesFor(e.code);
    if (!list.length && !withEmpty) return '';
    var n = evName(e) || e.code;
    var dance = danceText((SYL && SYL[e.code]) || '');
    /* 1区分だけ出しているときは、上も下も無いので並べ替えは出さない */
    var mv = only ? '' : '<span class="mv no-print">'
      + '<button type="button" data-mv="up"   data-code="' + esc(e.code) + '" title="ひとつ上へ">▲</button>'
      + '<button type="button" data-mv="down" data-code="' + esc(e.code) + '" title="ひとつ下へ">▼</button>'
      + '</span>';
    var h = '<section class="blk"><div class="ttl k-' + evKind(e) + '"><span class="nm">' + esc(n) + '</span>'
      + mv
      + (dance ? '<span class="dance"><span class="k">種目</span>' + esc(dance) + '</span>' : '')
      + '</div>';
    if (!list.length) {
      return h + '<div class="none">エントリーはありません。</div></section>';
    }
    /* プログラムの選手名簿と同じで、左の段に前半、右の段に後半を入れる。
       段数が増えても同じで、左から順に詰める。掲示用は1段組。
       どの区分も同じ段数・同じ列幅にそろえたいので、端数は左の段から1組ずつ配る
       （4組を3段なら 2・1・1。段ごとに幅が変わると、紙の見た目がばらつくため）。 */
    var cols = isPoster() ? 1 : COLS;
    var rows = Math.ceil(list.length / cols);
    var base = Math.floor(list.length / cols), rem = list.length % cols;
    var part = [], at = 0;
    for (var c = 0; c < cols; c++) {
      var take = base + (c < rem ? 1 : 0);
      part.push(list.slice(at, at + take));
      at += take;
    }
    var body = '';
    for (var i = 0; i < rows; i++) {
      var tr = '';
      for (var c2 = 0; c2 < cols; c2++) tr += (c2 ? '<td class="gap"></td>' : '') + cells(part[c2][i], memo);
      body += '<tr>' + tr + '</tr>';
    }
    var cw = colWidths(memo, cols);
    var hd = '';
    for (var c3 = 0; c3 < cols; c3++) hd += (c3 ? '<th class="gap"></th>' : '') + headCells(memo, cw);
    return h + '<table class="pg">' + colGroup(memo, cols, cw)
      + '<thead><tr>' + hd + '</tr></thead>'
      + '<tbody>' + body + '</tbody></table></section>';
  }).join('');

  el('paper').innerHTML = html;
}
</script>
