<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>出場・欠場 印刷 | 競技会受付システム</title>
<link rel="icon" href="favicon.ico">
<style>
  :root{--primary:#123262;--bg:#f4f5f7;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#e0e2e7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,-apple-system,"Segoe UI",sans-serif}
  header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center}
  header h1{font-size:16px;margin:0}
  header a{color:#fff;font-size:13px;margin-left:auto;text-decoration:none;opacity:.85}
  main{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  button{font-size:15px;font-weight:700;padding:10px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer}
  button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .muted{color:var(--muted);font-size:13px}
  .checkbox-row{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 0}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border)}
  th{background:#fafafa;color:var(--muted)}
  .event-block{margin-bottom:26px}
  .event-block h2{font-size:17px;margin:0 0 2px}
  .event-block h3{font-size:14px;margin:12px 0 4px;color:var(--muted)}
  @media print{
    header,.no-print{display:none !important}
    body{background:#fff}
    main{max-width:none;padding:0}
    .card{border:none;padding:0}
    .event-block{break-after:page;page-break-after:always}
    .event-block:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<header>
  <h1>出場・欠場 印刷</h1>
  <a href="uketsuke.html">← 受付システムへ戻る</a>
</header>

<main>
  <div class="card no-print">
    <div id="comp-name" class="muted"></div>
    <div style="height:8px"></div>
    <div id="ev-checks"></div>
    <div style="height:12px"></div>
    <button id="b-all" class="secondary">全て選択</button>
    <button id="b-none" class="secondary">全て解除</button>
    <button id="b-print">印刷する</button>
    <p class="muted" style="margin-bottom:0">種目ごとに改ページして印刷されます。</p>
  </div>
  <div id="report"></div>
</main>

<script>
'use strict';
var DATA = null;
function el(id){ return document.getElementById(id); }
function esc(s){ if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(iso){ if(!iso) return ''; var d=new Date(iso); return isNaN(d.getTime()) ? ''
  : d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function qs(k){ var m = new RegExp('[?&]'+k+'=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

var id = qs('id');
if (!id) { document.body.innerHTML = '<p style="padding:20px">大会が指定されていません。<a href="uketsuke.html">受付システム</a>から開いてください。</p>'; }
else {
  fetch('api/uketsuke_get.php?id=' + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      DATA = d;
      el('comp-name').textContent = d.name + (d.date ? '（' + d.date + '）' : '');
      el('ev-checks').innerHTML = (d.events||[]).map(function(e){
        return '<label class="checkbox-row"><input type="checkbox" class="evc" value="' + esc(e.code) + '" checked> '
          + esc(e.code) + ' ' + esc(e.name) + '</label>';
      }).join('');
      document.querySelectorAll('.evc').forEach(function(cb){ cb.addEventListener('change', render); });
      render();
    })
    .catch(function(e){
      document.body.innerHTML = '<p style="padding:20px">読み込めませんでした（' + esc(e.message)
        + '）。<a href="uketsuke.html">受付システム</a>でログインしてから開いてください。</p>';
    });
}

function render(){
  var done = {};
  (DATA.checkins||[]).forEach(function(c){ done[c.bib] = c.at; });
  var picked = [];
  document.querySelectorAll('.evc:checked').forEach(function(cb){ picked.push(cb.value); });

  el('report').innerHTML = (DATA.events||[]).filter(function(e){ return picked.indexOf(e.code) !== -1; })
    .map(function(e){
      var present = [], absent = [];
      (DATA.roster||[]).forEach(function(r){
        if ((r.events||[]).indexOf(e.code) === -1) return;
        if (done[r.bib]) present.push(r); else absent.push(r);
      });
      present.sort(function(a,b){ return a.bib-b.bib; });
      absent.sort(function(a,b){ return a.bib-b.bib; });

      return '<div class="event-block">'
        + '<h2>' + esc(e.code) + ' ' + esc(e.name) + '</h2>'
        + '<div class="muted">' + (e.start_time ? '開始 ' + esc(e.start_time) + '　' : '')
        + '出場 ' + present.length + ' / 欠場 ' + absent.length + '　'
        + esc(DATA.name) + (DATA.date ? '（' + esc(DATA.date) + '）' : '') + '</div>'
        + '<h3>出場（チェックイン済み）</h3>'
        + '<table><thead><tr><th>背番号</th><th>リーダー</th><th>パートナー</th><th>所属</th><th>受付時刻</th></tr></thead><tbody>'
        + (present.map(function(r){ return '<tr><td>' + esc(r.bib) + '</td><td>' + esc(r.leader) + '</td><td>'
            + esc(r.partner) + '</td><td>' + esc(r.affiliation) + '</td><td>' + esc(fmtTime(done[r.bib])) + '</td></tr>'; }).join('')
           || '<tr><td colspan="5" class="muted">なし</td></tr>')
        + '</tbody></table>'
        + '<h3>欠場（未チェックイン）</h3>'
        + '<table><thead><tr><th>背番号</th><th>リーダー</th><th>パートナー</th><th>所属</th></tr></thead><tbody>'
        + (absent.map(function(r){ return '<tr><td>' + esc(r.bib) + '</td><td>' + esc(r.leader) + '</td><td>'
            + esc(r.partner) + '</td><td>' + esc(r.affiliation) + '</td></tr>'; }).join('')
           || '<tr><td colspan="4" class="muted">なし</td></tr>')
        + '</tbody></table></div>';
    }).join('') || '<p class="muted">種目を選択してください</p>';
}

el('b-all').addEventListener('click', function(){ document.querySelectorAll('.evc').forEach(function(c){ c.checked=true; }); render(); });
el('b-none').addEventListener('click', function(){ document.querySelectorAll('.evc').forEach(function(c){ c.checked=false; }); render(); });
el('b-print').addEventListener('click', function(){ window.print(); });
</script>
</body>
</html>
