<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>特設サイト制作｜JDSF 近畿中四国ブロック委員会</title>
<style>
  :root{ --primary:#1B3A6B; --primary-dark:#0D2347; --border:#e2e8f0; --text-dark:#1a202c; --text-light:#718096; --bg:#f1f5f9; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--text-dark);line-height:1.6;}
  .hidden{display:none !important;}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 80px;}
  /* ログイン */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:36px 28px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center;}
  .login-card h1{font-size:1.15rem;margin:0 0 4px;color:var(--primary-dark);}
  .login-card p{font-size:.8rem;color:var(--text-light);margin:0 0 20px;}
  input[type=text],input[type=password],input[type=url],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;}
  input:focus,textarea:focus{outline:none;border-color:var(--primary);}
  .btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.875rem;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--primary-dark);}
  .btn-sec{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-sm{padding:5px 10px;font-size:.78rem;}
  .btn-del{background:#fff;color:#b91c1c;border:1px solid #fecaca;}
  /* ヘッダ */
  .topbar{background:var(--primary-dark);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar h1{font-size:1rem;margin:0;}
  .topbar a{color:#cbd5e1;font-size:.8rem;text-decoration:none;}
  /* セクション */
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:20px;}
  .card h2{font-size:1.02rem;margin:0 0 4px;border-left:4px solid var(--primary);padding-left:10px;color:var(--primary-dark);}
  .card .hint{font-size:.78rem;color:var(--text-light);margin:0 0 16px 14px;}
  label.fl{display:block;font-size:.78rem;font-weight:700;color:var(--text-dark);margin:12px 0 4px;}
  .row{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;}
  .row .h{cursor:grab;color:#94a3b8;font-size:.9rem;user-select:none;}
  .row .grow{flex:1;min-width:0;}
  .row input[type=text]{margin-bottom:4px;}
  .ck{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--text-light);white-space:nowrap;}
  .msg{display:none;margin-top:10px;font-size:.8rem;padding:8px 12px;border-radius:6px;}
  .msg.ok{display:block;background:#F0FFF4;color:#166534;border:1px solid #86EFAC;}
  .msg.ng{display:block;background:#FFF5F5;color:#B91C1C;border:1px solid #FECACA;}
  .slidegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .slidebox{border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;}
  .slidebox img{width:100%;height:80px;object-fit:cover;border-radius:6px;background:#e2e8f0;}
  .slidebox .ttl{font-size:.78rem;font-weight:700;margin-bottom:6px;}
  .sns-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .sns-row span{font-size:.8rem;width:90px;flex-shrink:0;font-weight:700;}
</style>
</head>
<body>

<!-- ===== ログイン ===== -->
<div id="login-screen">
  <div class="login-card">
    <h1>🎪 特設サイト制作</h1>
    <p>JDSF 近畿中四国ブロック委員会（主サイト）</p>
    <input type="password" id="pw-input" placeholder="パスワードを入力">
    <div id="login-error" class="msg ng" style="margin-bottom:8px;">⚠ パスワードが違います</div>
    <button class="btn" style="width:100%;margin-top:12px;" onclick="doLogin()">ログイン</button>
    <p style="margin-top:16px;"><a href="index.html" style="color:var(--text-light);font-size:.8rem;">← サイトに戻る</a></p>
  </div>
</div>

<!-- ===== 本体 ===== -->
<div id="content-screen" class="hidden">
  <div class="topbar">
    <h1>🎪 特設サイト制作</h1>
    <div>
      <a href="index.html" target="_blank">サイトを開く ↗</a>
      &nbsp;|&nbsp;
      <a href="site-config.html">⚙️ サイト構築へ</a>
      &nbsp;|&nbsp;
      <a href="#" onclick="doLogout();return false;">ログアウト</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>🎪 特設サイト（最大5つ）</h2>
      <p class="hint">トップページの<strong>ニュースティッカーのすぐ下</strong>に、横並びの文字ボタンとして表示されます。<strong>「表示」オフ・ボタン名が空の枠は出ません</strong>（全部オフならエリアごと非表示）。府県連盟の「サイト1〜5」とは別の、主サイト専用の仕組みです。</p>
      <div id="sp-list" style="display:grid;gap:14px;"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-sm" onclick="spSaveSites()">💾 特設サイトの設定を保存</button>
      </div>
      <div id="sp-msg" class="msg"></div>
    </div>
  </div>
</div>

<script>
'use strict';
var TOKEN = 'jdsfseibu2026';

/* ===== 認証（サーバー側セッション・build ロール／サイト構築ページと共通） ===== */
var ROLE = 'build';
window.__CSRF = '';
(function(){
  var _f = window.fetch;
  window.fetch = function(url, opts){
    opts = opts || {};
    try {
      if (typeof url === 'string' && url.indexOf('api/') !== -1 && String(opts.method||'').toUpperCase() === 'POST') {
        opts.headers = opts.headers || {};
        if (!('X-CSRF-Token' in opts.headers) && !('x-csrf-token' in opts.headers)) opts.headers['X-CSRF-Token'] = window.__CSRF || '';
      }
    } catch(e){}
    return _f.call(this, url, opts);
  };
})();
function doLogin(){
  var val = document.getElementById('pw-input').value;
  var fd = new FormData(); fd.append('role', ROLE); fd.append('password', val);
  fetch('api/login.php', {method:'POST', body:fd})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(res){
      var err = document.getElementById('login-error');
      if (res.j && res.j.ok) { window.__CSRF = res.j.csrf || ''; if(err){err.style.display='none';} showApp(); }
      else if (res.j && res.j.error === 'locked') { if(err){err.textContent='試行回数が多すぎます。しばらくしてからお試しください。'; err.classList.add('ng'); err.style.display='block';} }
      else { if(err){err.textContent='パスワードが正しくありません。'; err.classList.add('ng'); err.style.display='block';} }
    })
    .catch(function(){ var err=document.getElementById('login-error'); if(err){err.textContent='通信エラーが発生しました。'; err.style.display='block';} });
}
function doLogout(){
  var fd=new FormData(); fd.append('role', ROLE);
  fetch('api/logout.php',{method:'POST',body:fd}).catch(function(){});
  window.__CSRF=''; location.reload();
}
function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('content-screen').classList.remove('hidden');
  loadAll();
}
document.getElementById('pw-input').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
fetch('api/session-status.php').then(function(r){return r.json();}).then(function(d){ window.__CSRF=(d&&d.csrf)||''; if(d&&d.build) showApp(); }).catch(function(){});

function setMsg(id, text, ok){ var el=document.getElementById(id); el.className='msg '+(ok?'ok':'ng'); el.textContent=text; el.style.display='block'; if(ok) setTimeout(function(){el.style.display='none';},3500); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== データ読み込み ===== */
function loadAll(){
  Promise.all([
    fetch('data/special_sites.json?_='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch('data/special_contents.json?_='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(res){
    _sp  = spNormalize(res[0] && res[0].sites);
    _spc = (res[1] && typeof res[1]==='object') ? res[1] : {};
    spRender();
  });
}

/* ===== ⑥ 特設サイト（最大5つ・ページ本文は special.html?id=N で表示） ===== */
var _sp  = [];   /* スロット5件 */
var _spc = {};   /* { "1":[ブロック...], ... } */

var SP_TYPES = [
  {v:'text',  t:'📝 文章'},
  {v:'image', t:'🖼️ 画像'},
  {v:'pdf',   t:'📄 PDF'},
  {v:'link',  t:'🔗 リンクボタン'},
  {v:'embed', t:'🪟 サイト埋め込み'}
];

function spNormalize(sites){
  var out=[];
  for(var n=1;n<=5;n++){
    var s=null;
    if(Array.isArray(sites)){
      for(var i=0;i<sites.length;i++){ if(parseInt(sites[i].id,10)===n){ s=sites[i]; break; } }
    }
    s = s || {};
    out.push({
      id:n,
      enabled: s.enabled===true,
      label: s.label||'',
      mode: (s.mode==='embed'||s.mode==='external') ? s.mode : 'page',
      url: s.url||'',
      embed_url: s.embed_url||'',
      embed_height: parseInt(s.embed_height,10)||1200,
      hero_label: s.hero_label||'',
      hero_title: s.hero_title||'',
      hero_desc: s.hero_desc||''
    });
  }
  return out;
}

function spRender(){
  var box=document.getElementById('sp-list');
  if(!box) return;
  box.innerHTML = _sp.map(function(s,i){
    var n=s.id;
    var mode=s.mode;
    return '<div style="border:1.5px solid var(--border);border-radius:10px;padding:14px;background:#f8fafc;">'
      + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">'
        + '<label class="ck" style="font-size:.85rem;font-weight:700;color:var(--primary-dark);">'
          + '<input type="checkbox" '+(s.enabled?'checked':'')+' onchange="_sp['+i+'].enabled=this.checked"> 表示</label>'
        + '<strong style="font-size:.9rem;color:var(--primary);">特設サイト'+n+'</strong>'
        + '<a href="special.html?id='+n+'" target="_blank" style="font-size:.72rem;color:var(--text-light);margin-left:auto;">ページを開く ↗</a>'
      + '</div>'
      + '<label class="fl" style="margin-top:0;">ボタン名称（トップに出る文字）</label>'
      + '<input type="text" value="'+esc(s.label)+'" placeholder="例：第14回プレミアダンス大会 特設サイト" oninput="_sp['+i+'].label=this.value">'
      + '<label class="fl">👀 表示方法（このボタンを押したとき、どうなるか）</label>'
      + '<div style="display:flex;flex-wrap:wrap;gap:14px;padding:8px 12px;background:#fff;border:1.5px solid var(--border);border-radius:8px;">'
        + spModeRadio(i,n,'page','📄 このサイトにページを作る',mode)
        + spModeRadio(i,n,'embed','🪟 別のサイトを埋め込む',mode)
        + spModeRadio(i,n,'external','↗ 別のサイトへ移動',mode)
      + '</div>'
      /* --- 🪟 埋め込み --- */
      + '<div id="sp-box-embed-'+n+'" style="'+(mode==='embed'?'':'display:none;')+'margin-top:8px;">'
        + '<p class="hint" style="margin:0 0 6px 0;">別のサイトを、特設ページの中にそのまま表示します。ヘッダー・フッターは残ります。</p>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">'
          + '<div style="flex:2;min-width:200px;"><label class="fl" style="margin-top:0;">埋め込むサイトのURL</label>'
            + '<input type="url" id="sp-eurl-'+n+'" value="'+esc(s.embed_url)+'" placeholder="https://example.com/" oninput="_sp['+i+'].embed_url=this.value"></div>'
          + '<div style="flex:0 0 110px;"><label class="fl" style="margin-top:0;">高さ(px)</label>'
            + '<input type="number" id="sp-eh-'+n+'" value="'+s.embed_height+'" min="300" max="5000" step="100" oninput="_sp['+i+'].embed_height=parseInt(this.value,10)||1200" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;box-sizing:border-box;"></div>'
          + '<button class="btn btn-sm btn-sec" onclick="spPreviewEmbed('+n+')">👁 見え方を確認</button>'
        + '</div>'
        + '<div id="sp-epv-'+n+'"></div>'
      + '</div>'
      /* --- ↗ 外部へ移動 --- */
      + '<div id="sp-box-external-'+n+'" style="'+(mode==='external'?'':'display:none;')+'margin-top:8px;">'
        + '<label class="fl" style="margin-top:0;">移動先URL（トップのボタンから直接ここへ飛びます）</label>'
        + '<input type="url" value="'+esc(s.url)+'" placeholder="https://example.com/" oninput="_sp['+i+'].url=this.value">'
      + '</div>'
      /* --- ページ上部の見出し（page / embed で使用） --- */
      + '<div id="sp-box-hero-'+n+'" style="'+(mode==='external'?'display:none;':'')+'margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0;">'
        + '<p class="hint" style="margin:0 0 6px 0;">特設ページ上部の見出し（空欄なら「ボタン名称」を使います）</p>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
          + '<div style="flex:1 1 130px;"><label class="fl" style="margin-top:0;">小見出し（英字）</label>'
            + '<input type="text" value="'+esc(s.hero_label)+'" placeholder="Special 1" oninput="_sp['+i+'].hero_label=this.value"></div>'
          + '<div style="flex:2 1 220px;"><label class="fl" style="margin-top:0;">タイトル</label>'
            + '<input type="text" value="'+esc(s.hero_title)+'" placeholder="（空欄ならボタン名称）" oninput="_sp['+i+'].hero_title=this.value"></div>'
        + '</div>'
        + '<label class="fl">説明文</label>'
        + '<input type="text" value="'+esc(s.hero_desc)+'" placeholder="（任意）" oninput="_sp['+i+'].hero_desc=this.value">'
      + '</div>'
      /* --- 📄 コンテンツ管理（このサイトにページを作る ときだけ） --- */
      + '<div id="sp-box-page-'+n+'" style="'+(mode==='page'?'':'display:none;')+'margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0;">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;">'
          + '<strong style="font-size:.8rem;color:var(--text-light);">📄 ページの内容</strong>'
          + '<div style="display:flex;gap:6px;">'
            + '<button class="btn btn-sm btn-sec" onclick="spcAdd('+n+')">＋ ブロックを追加</button>'
            + '<button class="btn btn-sm" onclick="spcSave('+n+')">💾 内容を保存</button>'
          + '</div>'
        + '</div>'
        + '<div id="spc-list-'+n+'" style="display:grid;gap:8px;"></div>'
      + '</div>'
    + '</div>';
  }).join('');
  for(var n=1;n<=5;n++) spcRender(n);
}

function spModeRadio(i,n,value,label,current){
  return '<label class="ck" style="font-size:.8rem;font-weight:600;color:var(--text-dark);">'
    + '<input type="radio" name="sp-mode-'+n+'" value="'+value+'"'+(current===value?' checked':'')
    + ' onchange="spSetMode('+i+','+n+',\''+value+'\')"> '+label+'</label>';
}

function spSetMode(i,n,mode){
  _sp[i].mode = mode;
  ['page','embed','external'].forEach(function(m){
    var el=document.getElementById('sp-box-'+m+'-'+n);
    if(el) el.style.display = (m===mode) ? '' : 'none';
  });
  var hero=document.getElementById('sp-box-hero-'+n);
  if(hero) hero.style.display = (mode==='external') ? 'none' : '';
}

function spPreviewEmbed(n){
  var u=(document.getElementById('sp-eurl-'+n)||{value:''}).value.trim();
  var box=document.getElementById('sp-epv-'+n);
  if(!box) return;
  if(!/^https?:\/\//i.test(u)){ box.innerHTML='<p class="hint" style="color:#B91C1C;margin:6px 0 0;">⚠ 埋め込むURLを https:// から入力してください</p>'; return; }
  var h=parseInt((document.getElementById('sp-eh-'+n)||{value:''}).value,10);
  if(!(h>=300&&h<=5000)) h=1200;
  box.innerHTML = '<p class="hint" style="margin:6px 0 4px;">▼ 高さ '+h+'px の見え方（下が切れるなら高さを増やしてください）</p>'
    + '<div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;">'
    + '<iframe src="'+esc(u)+'" style="width:100%;height:'+h+'px;border:0;display:block;"></iframe></div>';
}

function spSaveSites(){
  var fd=new FormData(); fd.append('token',TOKEN); fd.append('sites',JSON.stringify(_sp));
  fetch('api/save_special_sites.php',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(res){ setMsg('sp-msg', res.ok?'✅ 保存しました（トップに反映されます）':('⚠ '+(res.error||'失敗')), !!res.ok); })
    .catch(function(){ setMsg('sp-msg','⚠ 通信エラー',false); });
}

/* --- ページの内容（ブロック） --- */
function spcOf(n){ var k=String(n); if(!Array.isArray(_spc[k])) _spc[k]=[]; return _spc[k]; }

function spcRender(n){
  var box=document.getElementById('spc-list-'+n);
  if(!box) return;
  var list=spcOf(n);
  if(!list.length){ box.innerHTML='<p class="hint" style="margin:0;">まだ内容がありません。「＋ ブロックを追加」で作成してください。</p>'; return; }
  box.innerHTML = list.map(function(it,i){
    return '<div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;">'
      + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">'
        + '<select onchange="spcSetType('+n+','+i+',this.value)" style="padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:.8rem;font-family:inherit;">'
          + SP_TYPES.map(function(t){ return '<option value="'+t.v+'"'+(it.type===t.v?' selected':'')+'>'+t.t+'</option>'; }).join('')
        + '</select>'
        + '<input type="text" value="'+esc(it.title||'')+'" placeholder="見出し（任意）" oninput="_spc[\''+n+'\']['+i+'].title=this.value" style="flex:1 1 160px;min-width:120px;padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:.8rem;font-family:inherit;">'
        + '<label class="ck"><input type="checkbox" '+(it.enabled!==false?'checked':'')+' onchange="_spc[\''+n+'\']['+i+'].enabled=this.checked"> 表示</label>'
        + '<label class="ck"><input type="checkbox" '+(it.show_title!==false?'checked':'')+' onchange="_spc[\''+n+'\']['+i+'].show_title=this.checked"> 見出しを出す</label>'
        + '<button class="btn btn-sm btn-sec" onclick="spcMove('+n+','+i+',-1)">↑</button>'
        + '<button class="btn btn-sm btn-sec" onclick="spcMove('+n+','+i+',1)">↓</button>'
        + '<button class="btn btn-sm btn-del" onclick="spcDel('+n+','+i+')">×</button>'
      + '</div>'
      + spcFields(n,i,it)
    + '</div>';
  }).join('');
}

function spcFields(n,i,it){
  var ref='_spc[\''+n+'\']['+i+']';
  var inp='style="width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:6px;font-size:.82rem;font-family:inherit;box-sizing:border-box;"';
  if(it.type==='text'){
    return '<textarea rows="4" placeholder="本文（URLは自動でリンクになります）" oninput="'+ref+'.body=this.value" '+inp+'>'+esc(it.body||'')+'</textarea>';
  }
  if(it.type==='image'){
    return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'
      + '<div id="spc-thumb-'+n+'-'+i+'">'+spcThumb(n,i,it.file_url||'','image')+'</div>'
      + '<input type="file" accept="image/*" onchange="if(this.files[0])spcUpload('+n+','+i+',this.files[0])" style="font-size:.72rem;">'
      + '</div>';
  }
  if(it.type==='pdf'){
    return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'
      + '<div id="spc-thumb-'+n+'-'+i+'">'+spcThumb(n,i,it.file_url||'','pdf')+'</div>'
      + '<input type="file" accept="application/pdf" onchange="if(this.files[0])spcUpload('+n+','+i+',this.files[0])" style="font-size:.72rem;">'
      + '<label class="ck">PC表示幅 <input type="number" value="'+(parseInt(it.pdf_pc_width,10)||100)+'" min="20" max="100" step="5" oninput="'+ref+'.pdf_pc_width=parseInt(this.value,10)||100" style="width:64px;padding:5px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:.78rem;font-family:inherit;"> %</label>'
      + '</div>';
  }
  if(it.type==='link'){
    return '<input type="url" value="'+esc(it.link_url||'')+'" placeholder="リンク先URL（https://...）" oninput="'+ref+'.link_url=this.value" '+inp+'>'
      + '<input type="text" value="'+esc(it.link_label||'')+'" placeholder="ボタンの文字（空なら見出しを使用）" oninput="'+ref+'.link_label=this.value" style="margin-top:5px;width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:6px;font-size:.82rem;font-family:inherit;box-sizing:border-box;">';
  }
  /* embed */
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'
    + '<input type="url" value="'+esc(it.embed_url||'')+'" placeholder="埋め込むURL（https://...）" oninput="'+ref+'.embed_url=this.value" style="flex:1 1 220px;min-width:180px;padding:7px 9px;border:1.5px solid var(--border);border-radius:6px;font-size:.82rem;font-family:inherit;box-sizing:border-box;">'
    + '<label class="ck">高さ <input type="number" value="'+(parseInt(it.embed_height,10)||1200)+'" min="300" max="5000" step="100" oninput="'+ref+'.embed_height=parseInt(this.value,10)||1200" style="width:80px;padding:5px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:.78rem;font-family:inherit;"> px</label>'
    + '</div>';
}

function spcThumb(n,i,url,kind){
  if(!url) return '<span style="font-size:.72rem;color:#888;">未設定</span>';
  var view = (kind==='image')
    ? '<img src="'+esc(url)+'" alt="" style="max-height:48px;max-width:120px;border:1px solid #ddd;border-radius:4px;background:#fff;display:block;">'
    : '<a href="'+esc(url)+'" target="_blank" style="font-size:.72rem;color:var(--primary);">📄 '+esc(url.replace(/^uploads\//,''))+'</a>';
  return view + '<button class="btn btn-sm btn-sec" style="display:block;margin-top:4px;" onclick="spcClearFile('+n+','+i+')">✕ 削除</button>';
}

function spcAdd(n){
  var list=spcOf(n);
  if(list.length>=30){ alert('1ページの上限は30ブロックです'); return; }
  list.push({id:'b'+Date.now().toString(36), title:'', enabled:true, show_title:true, type:'text',
             body:'', file_url:'', pdf_pc_width:100, link_url:'', link_label:'', embed_url:'', embed_height:1200});
  spcRender(n);
}
function spcDel(n,i){ spcOf(n).splice(i,1); spcRender(n); }
function spcMove(n,i,d){ var l=spcOf(n); var j=i+d; if(j<0||j>=l.length) return; var t=l[i]; l[i]=l[j]; l[j]=t; spcRender(n); }
function spcSetType(n,i,v){ spcOf(n)[i].type=v; spcRender(n); }
function spcClearFile(n,i){ spcOf(n)[i].file_url=''; spcRender(n); }

function spcUpload(n,i,file){
  var thumb=document.getElementById('spc-thumb-'+n+'-'+i);
  if(thumb) thumb.innerHTML='<span style="font-size:.72rem;color:var(--primary);">⏳ アップロード中...</span>';
  var fd=new FormData(); fd.append('file',file);
  if(spcOf(n)[i].type==='image') fd.append('max_px','1600');
  fetch('api/upload_file.php',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res && res.ok && res.url){ spcOf(n)[i].file_url=res.url; spcRender(n); setMsg('sp-msg','✅ アップロードしました（最後に「💾 内容を保存」を押してください）',true); }
      else { spcRender(n); setMsg('sp-msg','⚠ '+((res&&res.error)||'アップロードに失敗しました'),false); }
    })
    .catch(function(){ spcRender(n); setMsg('sp-msg','⚠ 通信エラー',false); });
}

function spcSave(n){
  var fd=new FormData(); fd.append('token',TOKEN); fd.append('site_id',String(n)); fd.append('items',JSON.stringify(spcOf(n)));
  fetch('api/save_special_contents.php',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(res){ setMsg('sp-msg', res.ok?('✅ 特設サイト'+n+'の内容を保存しました'):('⚠ '+(res.error||'失敗')), !!res.ok); })
    .catch(function(){ setMsg('sp-msg','⚠ 通信エラー',false); });
}
</script>
</body>
</html>
